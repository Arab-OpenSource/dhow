services:
  traefik:
    ports: !override
      - "127.0.0.1:${DHOW_PROXY_CHECK_HTTP_PORT:?}:80"
      - "127.0.0.1:${DHOW_PROXY_CHECK_PORT:?}:443"
    environment:
      LEGO_CA_CERTIFICATES: /pebble/pebble.minica.pem
    volumes:
      - ./pebble.minica.pem:/pebble/pebble.minica.pem:ro
    networks:
      acme: {}

  pebble:
    image: ${DHOW_PROXY_CHECK_PEBBLE_IMAGE:?}
    command: ["-config", "/test/config/pebble-config.json"]
    environment:
      PEBBLE_VA_ALWAYS_VALID: "1"
      PEBBLE_VA_NOSLEEP: "1"
    networks:
      acme:
        aliases: [pebble]

networks:
  acme:
    internal: true
