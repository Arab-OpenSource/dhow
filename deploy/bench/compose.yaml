services:
  postgres:
    image: ${BENCH_POSTGRES_IMAGE:-postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6}
    restart: "no"
    mem_limit: ${BENCH_DB_MEMORY:-2g}
    memswap_limit: ${BENCH_DB_MEMORY:-2g}
    cpus: ${BENCH_DB_CPUS:-2.0}

  dhow:
    restart: "no"
    mem_limit: ${BENCH_SERVER_MEMORY:-2g}
    memswap_limit: ${BENCH_SERVER_MEMORY:-2g}
    cpus: ${BENCH_SERVER_CPUS:-2.0}
