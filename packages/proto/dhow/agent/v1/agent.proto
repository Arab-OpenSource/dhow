syntax = "proto3";

package dhow.agent.v1;

message Frame {
  oneof body {
    Hello hello = 1;
    RunStep run_step = 2;
    Output output = 3;
    StepExit step_exit = 4;
    Signal signal = 5;
    AddMask add_mask = 6;
    Shutdown shutdown = 7;
  }
}

message Hello {
  int32 protocol_version = 1;
  string agent_version = 2;
}

message SecretFile {
  string name = 1;
  bytes data = 2;
}

message RunStep {
  int32 index = 1;
  string script = 2;
  map<string, string> env = 3;
  repeated SecretFile secret_files = 4;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

message Output {
  int32 step_index = 1;
  OutputStream stream = 2;
  bytes data = 3;
}

message StepExit {
  int32 index = 1;
  int32 exit_code = 2;
  int32 signal = 3;
}

enum ProcessSignal {
  PROCESS_SIGNAL_UNSPECIFIED = 0;
  PROCESS_SIGNAL_TERM = 1;
  PROCESS_SIGNAL_KILL = 2;
}

message Signal {
  int32 step_index = 1;
  ProcessSignal signal = 2;
}

message AddMask {
  bytes value = 1;
}

message Shutdown {}
