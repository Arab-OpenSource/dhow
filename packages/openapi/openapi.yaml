          $ref: "#/components/responses/Error"
  /organizations/{id}/teams/{teamId}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Read a team with its members and role bindings
      description: Needs `member.read`. A team of another organization is 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetailResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Rename a team or change its description
