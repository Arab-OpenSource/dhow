          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRoleBinding
      tags: [teams]
      summary: Take a role away from a team
      description: >-
        Needs `member.manage`, and the caller's role must be at least the role the binding grants. Members whose
        effective role drops are signed out everywhere.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/BindingId"
      responses:
        "200":
          description: The updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamChangeResponse"
