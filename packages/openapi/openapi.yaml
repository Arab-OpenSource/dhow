    OidcAuthorizationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/OidcAuthorization"
    OidcCallbackRequest:
      type: object
