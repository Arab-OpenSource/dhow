          $ref: "#/components/responses/Error"
  /organizations/{id}/teams/{teamId}/members:
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a member of the organization to a team
      description: >-
        Needs `member.manage`, and the caller's role must be at least every role the team grants. Only members of the
        organization can join its teams. If the member's effective role rises, every session of the member is revoked.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
