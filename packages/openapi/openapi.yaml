openapi: 3.0.3
info:
  title: Dhow API
  version: 0.1.0
  description: |
    Public REST API of the Dhow control plane. This file is the source of truth (spec-first):
    change it, run `make gen`, then implement. JSON field names are PascalCase and path segments are kebab-case.
    Every response uses the envelope: Success is required, and Data, Message, Meta and Error are omitted when absent.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
tags:
  - name: system
    description: Health and instance metadata. Served by the System module.
  - name: identity
    description: First-owner setup, organizations and members. Served by the Identity module.
  - name: session
    description: Sign-in, sign-out, the current user, own sessions and password change. Served by the Session module.
  - name: mfa
    description: >-
      The second sign-in step, TOTP, recovery codes and passkeys (WebAuthn). Served by the Session module, because the
      second step is part of signing in.
  - name: audit
    description: The tamper-evident audit log. Served by the Audit module.
  - name: runners
    description: >-
      Runners and their registration tokens. Served by the Runners module. Runners themselves talk to the server over
      Connect on /runner-api/, not over this API.
  - name: jobs
    description: >-
      Jobs, their attempts and steps. Served by the Jobs module. In M3 a job is created directly from a job spec; runners
      lease jobs over Connect on /runner-api/.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [system]
      summary: Liveness probe
      description: Returns 200 while the process is running. Does not touch dependencies.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe
      description: Returns 200 when the database is reachable and fully migrated, otherwise 503.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: >-
            Not ready. Success is false, Error carries the code `SERVICE_UNAVAILABLE`, and Data names each
            failing check without internal details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"
  /meta:
    get:
      operationId: getMeta
      tags: [system]
      summary: Instance metadata
      description: Public information the UI needs before sign-in.
      security: []
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: setupInstance
      tags: [identity]
      summary: Create the first owner and organization
      description: >-
        Works only while no owner exists. The setup token is the one logged at boot as
        `${PUBLIC_URL}/setup#<token>`, is valid for one hour and is single use. The request is atomic: two concurrent
        calls can never both succeed. The response sets no session: sign in afterwards.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: The owner and the organization were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    post:
      operationId: login
      tags: [session]
      summary: Sign in with email and password
      description: >-
        Failure is always `INVALID_CREDENTIALS` with the same body whether the account exists or not. A throttled
        account or address gets the same error plus a `Retry-After` header. Success sets the
        `__Host-dhow_session` cookie (`HttpOnly; Secure; SameSite=Strict; Path=/`), replaces any session cookie the
        request carried, and returns the CSRF token the client must send as `X-CSRF-Token` on every non-GET request.
        When the account has a second factor (TOTP or a passkey), a correct password answers 202 instead: no session
        is created, and the `__Host-dhow_mfa` cookie carries a challenge that is valid for 5 minutes, works once and
        is bound to the user and the browser. Only `POST /sessions/mfa` turns it into a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "202":
          description: The password is right and the second step is required.
          headers:
            Set-Cookie:
              description: The `__Host-dhow_mfa` challenge cookie (`HttpOnly; Secure; SameSite=Strict; Path=/`).
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaPendingResponse"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSessions
      tags: [session]
      summary: List the signed-in user's own sessions
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Active sessions of the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/current:
    delete:
      operationId: logout
      tags: [session]
      summary: Sign out of the current session
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The session was revoked and the cookie cleared.
          headers:
            Set-Cookie:
              description: An expired session cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        default:
          $ref: "#/components/responses/Error"
  /sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [session]
      summary: Sign out of every other device
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: Every session except the current one was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedCountResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [session]
      summary: Revoke one of the user's own sessions
      description: Another user's session id answers 404, exactly like an id that does not exist.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        default:
          $ref: "#/components/responses/Error"
  /sessions/mfa:
    post:
      operationId: completeMfaLogin
      tags: [mfa]
      summary: Finish signing in with the second factor
      description: >-
        Needs the `__Host-dhow_mfa` cookie from `POST /sessions`; the user comes from that challenge, never from the
        request. Accepts a TOTP code, an unused recovery code or a passkey assertion (after
        `POST /sessions/mfa/passkey-options`). A missing, expired, used or foreign-browser challenge answers
        `MFA_CHALLENGE_EXPIRED`. A wrong factor answers `INVALID_MFA_CODE` whatever the reason; attempts are throttled
        per account and per address like the password, and a throttled attempt adds `Retry-After`. Success sets the
        session cookie and clears the challenge cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaLoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie, plus an expired `__Host-dhow_mfa` cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/mfa/passkey-options:
    post:
      operationId: beginMfaPasskey
      tags: [mfa]
      summary: Passkey request options for the second step
      description: >-
        Needs the `__Host-dhow_mfa` cookie. Returns WebAuthn request options for the user's passkeys and binds their
        challenge to the pending sign-in. The options keep the W3C WebAuthn JSON names.
      security: []
      responses:
        "200":
          description: Options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptionsResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/passkey-options:
    post:
      operationId: beginPasskeyLogin
      tags: [mfa]
      summary: Passkey request options for signing in without a password
      description: >-
        Starts a discoverable-credential ceremony with user verification required. The challenge is stored on the
        server, lives 5 minutes and works once.
      security: []
      responses:
        "200":
          description: The challenge id and options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallengeResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/passkey:
    post:
      operationId: passkeyLogin
      tags: [mfa]
      summary: Sign in with a passkey
      description: >-
        Verifies the assertion against the stored challenge, the configured RP ID and origin, and the stored public
        key and sign count. Any failure answers `INVALID_CREDENTIALS`. Success sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/mfa:
    get:
      operationId: getMfaStatus
      tags: [mfa]
      summary: Which second factors the signed-in user has
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The second-factor status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStatusResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/mfa/passkey-options:
    post:
      operationId: beginStepUpPasskey
      tags: [mfa]
      summary: Passkey request options to confirm a change with a passkey
      description: >-
        For a `CurrentFactor` of method `passkey`. The challenge is bound to the user and the current session, lives 5
        minutes and works once.
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The challenge id and options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallengeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/totp:
    post:
      operationId: startTotpEnrollment
      tags: [mfa]
      summary: Start turning on TOTP (or replacing it)
      description: >-
        Generates a new secret on the server and stores it encrypted. The secret and its `otpauth://` URI are returned
        once so the client can draw a QR code; nothing is active until `POST /me/totp/confirm`. A pending enrollment
        lives 10 minutes and belongs to the session that started it.
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The pending enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollmentResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [mfa]
      summary: Turn TOTP on with a code from the new app
      description: >-
        Needs a code from the new authenticator and a current factor: the password when the account has no second
        factor yet, otherwise a TOTP code, a recovery code or a passkey. Replaces an existing TOTP, revokes every other
        session and, for the first second factor, returns 10 recovery codes once.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
      responses:
        "200":
          description: TOTP is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/totp/disable:
    post:
      operationId: disableTotp
      tags: [mfa]
      summary: Turn TOTP off
      description: >-
        Needs a current second factor. Revokes every other session. When no second factor is left, the recovery codes
        are removed too.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: TOTP is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [mfa]
      summary: Replace the recovery codes
      description: >-
        Needs a current second factor. Returns 10 new codes once (each carries 80 random bits and works once); the old
        codes stop working. Revokes every other session.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: The new codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys:
    get:
      operationId: listPasskeys
      tags: [mfa]
      summary: List the signed-in user's passkeys
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The passkeys, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addPasskey
      tags: [mfa]
      summary: Register a passkey
      description: >-
        Needs the challenge from `POST /me/passkeys/options`, the attestation from `navigator.credentials.create()` and
        a current factor (the password when the account has no second factor yet). Revokes every other session and,
        for the first second factor, returns 10 recovery codes once.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasskeyRequest"
      responses:
        "200":
          description: The passkey was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPasskeyResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/options:
    post:
      operationId: beginPasskeyRegistration
      tags: [mfa]
      summary: Passkey creation options
      description: >-
        Requires a discoverable credential, prefers user verification and excludes the user's existing passkeys. The
        challenge is bound to the user and the current session, lives 5 minutes and works once.
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The challenge id and options for `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallengeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/{id}:
    patch:
      operationId: renamePasskey
      tags: [mfa]
      summary: Rename one of the user's passkeys
      description: Another user's passkey id answers 404, exactly like an id that does not exist.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePasskeyRequest"
      responses:
        "200":
          description: The renamed passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/{id}/remove:
    post:
      operationId: removePasskey
      tags: [mfa]
      summary: Remove one of the user's passkeys
      description: >-
        Needs a current second factor. Revokes every other session. When no second factor is left, the recovery codes
        are removed too. Another user's passkey id answers 404.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: The passkey was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      tags: [session]
      summary: The signed-in user, memberships and CSRF token
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    put:
      operationId: changePassword
      tags: [session]
      summary: Change the signed-in user's password
      description: >-
        Needs the current password. The new one is 12 to 128 characters, must differ from the current one and must not
        appear in a known breach (Have I Been Pwned k-anonymity range check, when enabled). Every other session of the
        user is revoked.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: The password was changed and the other sessions were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedCountResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [identity]
      summary: Read an organization
      description: Needs `org.read`. A caller who is not a member gets 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrganization
      tags: [identity]
      summary: Rename an organization
      description: Needs `org.update`. A caller who is not a member gets 404.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/members:
    get:
      operationId: listMembers
      tags: [identity]
      summary: List the members of an organization
      description: Needs `member.read`. A caller who is not a member gets 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List the audit events of an organization
      description: Needs `audit.read`. Newest first. A caller who is not a member gets 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/audit-events/verify:
    get:
      operationId: verifyAuditChain
      tags: [audit]
      summary: Verify the hash chain of an organization's audit log
      description: >-
        Needs `audit.read`. Walks the chain from the oldest event and reports the first event whose hash or link is
        wrong.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerifyResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runners:
    get:
      operationId: listRunners
      tags: [runners]
      summary: List the runners of an organization
      description: >-
        Needs `runner.read`. Newest first. `Status` is computed: `online` when the runner was seen in the last two
        minutes. Never contains a key or a token. A caller who is not a member gets 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of runners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runners/{runnerId}:
    get:
      operationId: getRunner
      tags: [runners]
      summary: Read a runner
      description: Needs `runner.read`. Never contains a key or a token. A runner of another organization gets 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RunnerId"
      responses:
        "200":
          description: The runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRunner
      tags: [runners]
      summary: Rename a runner, change its labels, or disable and enable it
      description: >-
        Needs `runner.manage`. A disabled runner gets no new jobs and finishes the running ones. Labels that start with
        `dhow.` are reserved for capabilities the runner reports. A revoked runner answers 409 `RUNNER_REVOKED`.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RunnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRunnerRequest"
      responses:
        "200":
          description: The updated runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runners/{runnerId}/revoke:
    post:
      operationId: revokeRunner
      tags: [runners]
      summary: Revoke a runner for good
      description: >-
        Needs `runner.manage`. Ends every session of the runner, so its next call is refused. Revoking is final and
        idempotent: the runner has to register again with a new identity.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RunnerId"
      responses:
        "200":
          description: The revoked runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runner-registration-tokens:
    get:
      operationId: listRunnerRegistrationTokens
      tags: [runners]
      summary: List the runner registration tokens of an organization
      description: Needs `runner.manage`. Metadata only, the token itself is never shown again.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of registration tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerRegistrationTokenListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRunnerRegistrationToken
      tags: [runners]
      summary: Create a runner registration token
      description: >-
        Needs `runner.manage`. The token is returned once, in this response only, together with the command that
        registers a runner. It is valid for one use and one hour by default, for at most 50 uses and 24 hours.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunnerRegistrationTokenRequest"
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRunnerRegistrationTokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runner-registration-tokens/{tokenId}/revoke:
    post:
      operationId: revokeRunnerRegistrationToken
      tags: [runners]
      summary: Revoke a runner registration token
      description: Needs `runner.manage`. Idempotent. Runners already registered with it keep working.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TokenId"
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerRegistrationTokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List the jobs of an organization
      description: >-
        Needs `job.read`. Newest first, optionally filtered by state. A caller who is not a member gets 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/JobStateFilter"
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job from a job spec
      description: >-
        Needs `job.create`. The spec is validated and normalized (defaults filled in) and the job is queued. The image
        must be pinned by digest. A spec that references secrets is refused with 422 `SECRETS_UNAVAILABLE` while no
        secret store is configured.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Read a job with its spec, attempts and steps
      description: >-
        Needs `job.read`. A queued job that no active runner of the organization can take carries `QueuedReason`
        `NO_MATCHING_RUNNER`. A job of another organization gets 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job
      description: >-
        Needs `job.cancel`. Idempotent. A queued job is canceled at once. A leased or running job is marked, its runner
        sees the request on its next heartbeat and no step may begin after it. A job that already finished in another
        state answers 409 `JOB_FINISHED`.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-dhow_session
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobStateFilter:
      name: State
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/JobState"
    Page:
      name: Page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: Limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Error:
      description: An error. Never contains internal details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Envelope:
      type: object
      required: [Success]
      properties:
        Success:
          type: boolean
        Message:
          type: string
          description: An i18n key such as `system.meta.loaded`. The client translates it.
          example: system.meta.loaded
        Meta:
          $ref: "#/components/schemas/PageMeta"
        Error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [Error]
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/HealthStatus"
    MetaResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Meta"
    PageMeta:
      type: object
      additionalProperties: false
      required: [Page, Limit, Total]
      properties:
        Page:
          type: integer
          minimum: 1
        Limit:
          type: integer
          minimum: 1
        Total:
          type: integer
          minimum: 0
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [Code, Message]
      properties:
        Code:
          type: string
          description: >-
            Stable machine-readable UPPER_SNAKE code: `INTERNAL`, `NOT_FOUND`, `METHOD_NOT_ALLOWED`,
            `BAD_REQUEST`, `VALIDATION_FAILED`, `PAYLOAD_TOO_LARGE`, `SERVICE_UNAVAILABLE`, `UNAUTHENTICATED`,
            `FORBIDDEN`, `CSRF_FAILED`, `INVALID_CREDENTIALS`, `INVALID_CURRENT_PASSWORD`, `PASSWORD_BREACHED`,
            `SETUP_COMPLETED`, `SETUP_TOKEN_INVALID`, `CONFLICT`, `MFA_CHALLENGE_EXPIRED`, `INVALID_MFA_CODE`,
            `INVALID_CURRENT_FACTOR`, `ENROLLMENT_EXPIRED` or `PASSKEY_REJECTED`.
          example: INTERNAL
        Message:
          type: string
          description: Message translated by the server for the Accept-Language locale (Arabic by default).
          example: Something went wrong. Try again later.
        Details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFieldDetail"
    ErrorFieldDetail:
      type: object
      additionalProperties: false
      required: [Field, Message]
      properties:
        Field:
          type: string
        Message:
          type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required: [Status, Checks]
      properties:
        Status:
          type: string
          enum: [ok, unavailable]
        Checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      additionalProperties: false
      required: [Name, Ok]
      properties:
        Name:
          type: string
          enum: [database, migrations]
        Ok:
          type: boolean
    Meta:
      type: object
      additionalProperties: false
      required: [Version, Commit, SetupRequired]
      properties:
        Version:
          type: string
          example: v0.1.0
        Commit:
          type: string
          example: 2e39188
        SetupRequired:
          type: boolean
          description: True until the first owner completes setup.
    SetupRequest:
      type: object
      additionalProperties: false
      required: [SetupToken, OwnerName, Email, Password, OrganizationName, OrganizationSlug]
      properties:
        SetupToken:
          type: string
          minLength: 1
          maxLength: 256
        OwnerName:
          type: string
          minLength: 1
          maxLength: 100
        Email:
          type: string
          maxLength: 254
        Password:
          type: string
          maxLength: 1024
          description: 12 to 128 characters. Never returned and never logged.
        OrganizationName:
          type: string
          minLength: 1
          maxLength: 100
        OrganizationSlug:
          type: string
          maxLength: 63
          description: Lowercase letters, digits and single hyphens. Unique among organizations.
        Locale:
          $ref: "#/components/schemas/Locale"
    SetupResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/SetupResult"
    SetupResult:
      type: object
      additionalProperties: false
      required: [User, Organization]
      properties:
        User:
          $ref: "#/components/schemas/User"
        Organization:
          $ref: "#/components/schemas/Organization"
    Locale:
      type: string
      enum: [ar, en]
    User:
      type: object
      additionalProperties: false
      required: [Id, Email, Name, Locale]
      properties:
        Id:
          type: string
          format: uuid
        Email:
          type: string
        Name:
          type: string
        Locale:
          $ref: "#/components/schemas/Locale"
    Role:
      type: string
      enum: [owner, admin, maintainer, developer, viewer]
    Organization:
      type: object
      additionalProperties: false
      required: [Id, Name, Slug, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        Slug:
          type: string
        CreatedAt:
          type: string
          format: date-time
    OrganizationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Organization"
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
    Member:
      type: object
      additionalProperties: false
      required: [UserId, Name, Email, Role, JoinedAt]
      properties:
        UserId:
          type: string
          format: uuid
        Name:
          type: string
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/Role"
        JoinedAt:
          type: string
          format: date-time
    MemberListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Member"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [Email, Password]
      properties:
        Email:
          type: string
          maxLength: 254
        Password:
          type: string
          maxLength: 1024
          description: Never returned and never logged.
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/LoginResult"
    LoginResult:
      type: object
      additionalProperties: false
      required: [User, CsrfToken, ExpiresAt]
      properties:
        User:
          $ref: "#/components/schemas/User"
        CsrfToken:
          type: string
          description: Send as the `X-CSRF-Token` header on every non-GET request.
        ExpiresAt:
          type: string
          format: date-time
          description: When the session ends at the latest (absolute timeout).
    MembershipView:
      type: object
      additionalProperties: false
      required: [OrganizationId, OrganizationName, OrganizationSlug, Role]
      properties:
        OrganizationId:
          type: string
          format: uuid
        OrganizationName:
          type: string
        OrganizationSlug:
          type: string
        Role:
          $ref: "#/components/schemas/Role"
    MeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Me"
    Me:
      type: object
      additionalProperties: false
      required: [User, Memberships, CsrfToken, SessionId, ExpiresAt]
      properties:
        User:
          $ref: "#/components/schemas/User"
        Memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipView"
        CsrfToken:
          type: string
        SessionId:
          type: string
          format: uuid
        ExpiresAt:
          type: string
          format: date-time
    SessionView:
      type: object
      additionalProperties: false
      required: [Id, CreatedAt, LastSeenAt, ExpiresAt, UserAgent, IpAddress, Current]
      properties:
        Id:
          type: string
          format: uuid
        CreatedAt:
          type: string
          format: date-time
        LastSeenAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
        UserAgent:
          type: string
        IpAddress:
          type: string
        Current:
          type: boolean
    SessionListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/SessionView"
    RevokedCountResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RevokedCount"
    RevokedCount:
      type: object
      additionalProperties: false
      required: [Revoked]
      properties:
        Revoked:
          type: integer
          minimum: 0
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [CurrentPassword, NewPassword]
      properties:
        CurrentPassword:
          type: string
          maxLength: 1024
        NewPassword:
          type: string
          maxLength: 1024
          description: 12 to 128 characters.
    AuditEvent:
      type: object
      additionalProperties: false
      required: [Id, CreatedAt, Action, TargetType, TargetId, Ip, Data]
      properties:
        Id:
          type: string
          format: uuid
        CreatedAt:
          type: string
          format: date-time
        OrganizationId:
          type: string
          format: uuid
        ActorUserId:
          type: string
          format: uuid
        Action:
          type: string
          example: auth.login
        TargetType:
          type: string
        TargetId:
          type: string
        Ip:
          type: string
        Data:
          type: object
          additionalProperties:
            type: string
          description: Context of the event. Never contains a secret.
    AuditEventListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
    AuditVerifyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/AuditVerifyResult"
    AuditVerifyResult:
      type: object
      additionalProperties: false
      required: [Valid, Checked]
      properties:
        Valid:
          type: boolean
        Checked:
          type: integer
          minimum: 0
        FirstBrokenId:
          type: string
          format: uuid
    MfaMethod:
      type: string
      enum: [totp, recovery_code, passkey]
    FactorMethod:
      type: string
      enum: [password, totp, recovery_code, passkey]
    WebAuthnJson:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      description: >-
        A W3C WebAuthn JSON structure (`PublicKeyCredentialCreationOptionsJSON`, `PublicKeyCredentialRequestOptionsJSON`
        or the `toJSON()` form of a `PublicKeyCredential`). It keeps the camelCase names of the WebAuthn specification,
        the only place where the API does not use PascalCase.
    MfaPending:
      type: object
      additionalProperties: false
      required: [Methods, ExpiresAt]
      properties:
        Methods:
          type: array
          items:
            $ref: "#/components/schemas/MfaMethod"
          description: The second factors this account can use.
        ExpiresAt:
          type: string
          format: date-time
    MfaPendingResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MfaPending"
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required: [Method]
      properties:
        Method:
          $ref: "#/components/schemas/MfaMethod"
        Code:
          type: string
          maxLength: 64
          description: The TOTP code or the recovery code. Never logged.
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [Options, ExpiresAt]
      properties:
        Options:
          $ref: "#/components/schemas/WebAuthnJson"
        ExpiresAt:
          type: string
          format: date-time
    PasskeyOptionsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/PasskeyOptions"
    PasskeyChallenge:
      type: object
      additionalProperties: false
      required: [ChallengeId, Options, ExpiresAt]
      properties:
        ChallengeId:
          type: string
          format: uuid
        Options:
          $ref: "#/components/schemas/WebAuthnJson"
        ExpiresAt:
          type: string
          format: date-time
    PasskeyChallengeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/PasskeyChallenge"
    PasskeyLoginRequest:
      type: object
      additionalProperties: false
      required: [ChallengeId, Credential]
      properties:
        ChallengeId:
          type: string
          format: uuid
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    CurrentFactor:
      type: object
      additionalProperties: false
      required: [Method]
      description: >-
        Proof of a factor the user already has. `password` is accepted only while the account has no second factor;
        afterwards one of `totp`, `recovery_code` or `passkey` is required. A wrong factor answers
        `INVALID_CURRENT_FACTOR` and is throttled like a sign-in attempt.
      properties:
        Method:
          $ref: "#/components/schemas/FactorMethod"
        Password:
          type: string
          maxLength: 1024
        Code:
          type: string
          maxLength: 64
        ChallengeId:
          type: string
          format: uuid
          description: From `POST /me/mfa/passkey-options`, for method `passkey`.
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    CurrentFactorRequest:
      type: object
      additionalProperties: false
      required: [CurrentFactor]
      properties:
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    MfaStatus:
      type: object
      additionalProperties: false
      required: [Enabled, TotpEnabled, RecoveryCodesRemaining, PasskeyCount]
      properties:
        Enabled:
          type: boolean
          description: True when the account has TOTP or at least one passkey.
        TotpEnabled:
          type: boolean
        TotpEnabledAt:
          type: string
          format: date-time
        RecoveryCodesRemaining:
          type: integer
          minimum: 0
        PasskeyCount:
          type: integer
          minimum: 0
    MfaStatusResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MfaStatus"
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [Secret, Uri, ExpiresAt]
      properties:
        Secret:
          type: string
          description: Base32 without padding. Shown once, for typing by hand.
        Uri:
          type: string
          description: The `otpauth://totp/...` URI for the QR code. Drawn by the client, never sent to a third party.
        ExpiresAt:
          type: string
          format: date-time
    TotpEnrollmentResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/TotpEnrollment"
    ConfirmTotpRequest:
      type: object
      additionalProperties: false
      required: [Code, CurrentFactor]
      properties:
        Code:
          type: string
          maxLength: 64
          description: A code from the new authenticator.
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    MfaChange:
      type: object
      additionalProperties: false
      required: [Revoked]
      properties:
        Revoked:
          type: integer
          minimum: 0
          description: How many other sessions were revoked.
        RecoveryCodes:
          type: array
          items:
            type: string
          description: New recovery codes. Present only when new codes were made, and shown only this once.
    MfaChangeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MfaChange"
    Passkey:
      type: object
      additionalProperties: false
      required: [Id, Name, CreatedAt, Transports, Synced]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        CreatedAt:
          type: string
          format: date-time
        LastUsedAt:
          type: string
          format: date-time
        Transports:
          type: array
          items:
            type: string
        Synced:
          type: boolean
          description: The authenticator reported the credential as backup eligible (a synced passkey).
    PasskeyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Passkey"
    PasskeyListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Passkey"
    AddPasskeyRequest:
      type: object
      additionalProperties: false
      required: [ChallengeId, Credential, Name, CurrentFactor]
      properties:
        ChallengeId:
          type: string
          format: uuid
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
        Name:
          type: string
          minLength: 1
          maxLength: 64
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    AddPasskeyResult:
      type: object
      additionalProperties: false
      required: [Passkey, Revoked]
      properties:
        Passkey:
          $ref: "#/components/schemas/Passkey"
        Revoked:
          type: integer
          minimum: 0
        RecoveryCodes:
          type: array
          items:
            type: string
    AddPasskeyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/AddPasskeyResult"
    RenamePasskeyRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 64
    RunnerState:
      type: string
      enum: [active, disabled, revoked]
    RunnerStatus:
      type: string
      enum: [online, offline, disabled, revoked]
      description: Computed from the state and from when the runner was last seen (online within two minutes).
    RunnerDisabledReason:
      type: string
      enum: [manual, clone_suspected]
    RunnerIsolation:
      type: string
      enum: [container, gvisor]
    Runner:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, Name, Labels, CapabilityLabels, Os, Arch, Version, IsolationLevels, Capacity, State,
                 Status, KeyVersion, KeysRotatedAt, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        Name:
          type: string
        Labels:
          type: array
          items:
            type: string
          description: Labels chosen by an administrator. They decide which jobs the runner may take.
        CapabilityLabels:
          type: array
          items:
            type: string
          description: Reported by the runner, with the reserved `dhow.` prefix, for example `dhow.os=linux`.
        Os:
          type: string
        Arch:
          type: string
        Version:
          type: string
        IsolationLevels:
          type: array
          items:
            $ref: "#/components/schemas/RunnerIsolation"
        Capacity:
          type: integer
          minimum: 1
          maximum: 16
        State:
          $ref: "#/components/schemas/RunnerState"
        Status:
          $ref: "#/components/schemas/RunnerStatus"
        DisabledReason:
          $ref: "#/components/schemas/RunnerDisabledReason"
        KeyVersion:
          type: integer
          minimum: 1
        KeysRotatedAt:
          type: string
          format: date-time
        LastSeenAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        RevokedAt:
          type: string
          format: date-time
    RunnerResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Runner"
    RunnerListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Runner"
    UpdateRunnerRequest:
      type: object
      additionalProperties: false
      properties:
        Name:
          type: string
          maxLength: 100
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
        Disabled:
          type: boolean
    RunnerRegistrationTokenStatus:
      type: string
      enum: [active, expired, used_up, revoked]
    RunnerRegistrationToken:
      type: object
      additionalProperties: false
      required: [Id, Description, Labels, MaxUses, Uses, ExpiresAt, Status, CreatedAt, CreatedByUserId]
      properties:
        Id:
          type: string
          format: uuid
        Description:
          type: string
        Labels:
          type: array
          items:
            type: string
        MaxUses:
          type: integer
          minimum: 1
          maximum: 50
        Uses:
          type: integer
          minimum: 0
        ExpiresAt:
          type: string
          format: date-time
        Status:
          $ref: "#/components/schemas/RunnerRegistrationTokenStatus"
        CreatedAt:
          type: string
          format: date-time
        CreatedByUserId:
          type: string
          format: uuid
        LastUsedAt:
          type: string
          format: date-time
        RevokedAt:
          type: string
          format: date-time
    RunnerRegistrationTokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RunnerRegistrationToken"
    RunnerRegistrationTokenListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/RunnerRegistrationToken"
    CreateRunnerRegistrationTokenRequest:
      type: object
      additionalProperties: false
      properties:
        Description:
          type: string
          maxLength: 200
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
        MaxUses:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
        ExpiresInSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
    CreatedRunnerRegistrationToken:
      type: object
      additionalProperties: false
      required: [RegistrationToken, Token, RegisterCommand]
      properties:
        RegistrationToken:
          $ref: "#/components/schemas/RunnerRegistrationToken"
        Token:
          type: string
          description: Shown once. Starts with `dhow_rrt_`. Pass it to the runner on standard input or in a file.
        RegisterCommand:
          type: string
          description: The command that registers a runner. It reads the token from standard input, never from argv.
    CreatedRunnerRegistrationTokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/CreatedRunnerRegistrationToken"
    JobState:
      type: string
      enum: [queued, leased, running, succeeded, failed, canceled, timed_out, lost]
    JobAttemptState:
      type: string
      enum: [leased, running, succeeded, failed, canceled, timed_out, lost]
    JobStepState:
      type: string
      enum: [running, succeeded, failed, interrupted]
    JobIsolation:
      type: string
      enum: [container, gvisor]
    JobQueuedReason:
      type: string
      enum: [NO_MATCHING_RUNNER]
    JobStep:
      type: object
      additionalProperties: false
      required: [Name, Run]
      properties:
        Name:
          type: string
          maxLength: 100
        Run:
          type: string
          description: A shell script, run with `/bin/sh -e -s`.
        Env:
          type: object
          additionalProperties:
            type: string
        Mutating:
          type: boolean
          description: The step changes a deploy target, so the job is never retried automatically once it began.
        TimeoutSeconds:
          type: integer
          minimum: 0
          description: Zero means the job timeout.
    JobSecretRef:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          maxLength: 64
        AsEnv:
          type: string
          description: The environment variable that carries the value. Exactly one of AsEnv and AsFile.
        AsFile:
          type: string
          description: A file name under /run/dhow/secrets. Exactly one of AsEnv and AsFile.
        Steps:
          type: array
          items:
            type: integer
            minimum: 0
          description: The step indexes that see the secret. Empty means every step.
    JobResources:
      type: object
      additionalProperties: false
      properties:
        CpuMillis:
          type: integer
          format: int64
        MemoryBytes:
          type: integer
          format: int64
        Pids:
          type: integer
          format: int64
        DiskBytes:
          type: integer
          format: int64
    JobNetwork:
      type: object
      additionalProperties: false
      properties:
        Egress:
          type: array
          maxItems: 100
          items:
            type: string
          description: Hosts the job may reach through the runner proxy, as `host`, `*.host` or `host:port`.
    JobSpec:
      type: object
      additionalProperties: false
      required: [Image, Steps]
      properties:
        Image:
          type: string
          description: An image reference pinned by digest (`name@sha256:...`).
        Steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/JobStep"
        Env:
          type: object
          additionalProperties:
            type: string
          description: Plain environment for every step. Names that start with `DHOW_` are reserved.
        Secrets:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/JobSecretRef"
        Resources:
          $ref: "#/components/schemas/JobResources"
        TimeoutSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Zero means one hour.
        Network:
          $ref: "#/components/schemas/JobNetwork"
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
          description: Every label must be on the runner, including the reserved `dhow.` capability labels.
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [Name, Spec]
      properties:
        Name:
          type: string
          maxLength: 100
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Priority:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Higher runs first among queued jobs.
        MaxInfraRetries:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
          description: How many times a job that lost its runner before any mutating step is queued again.
    Job:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, Name, State, Labels, Isolation, Priority, Image, SpecDigest, AttemptCount,
                 MaxInfraRetries, QueuedAt, QueueDeadline, CreatedAt, CreatedByUserId]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        Name:
          type: string
        State:
          $ref: "#/components/schemas/JobState"
        FailureReason:
          type: string
          description: Why the job ended the way it did, for example `QUEUE_TIMEOUT` or `LOST_AFTER_MUTATION`.
        QueuedReason:
          $ref: "#/components/schemas/JobQueuedReason"
        Labels:
          type: array
          items:
            type: string
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Priority:
          type: integer
        Image:
          type: string
        SpecDigest:
          type: string
          description: Hex SHA-256 of the normalized spec.
        AttemptCount:
          type: integer
          minimum: 0
        MaxInfraRetries:
          type: integer
          minimum: 0
        QueuedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        Deadline:
          type: string
          format: date-time
        QueueDeadline:
          type: string
          format: date-time
        CancelRequestedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        CreatedByUserId:
          type: string
          format: uuid
    JobAttemptStep:
      type: object
      additionalProperties: false
      required: [Index, Name, Mutating, State, StartedAt]
      properties:
        Index:
          type: integer
          minimum: 0
        Name:
          type: string
        Mutating:
          type: boolean
        State:
          $ref: "#/components/schemas/JobStepState"
        ExitCode:
          type: integer
        FailureReason:
          type: string
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
    JobAttempt:
      type: object
      additionalProperties: false
      required: [Id, Number, RunnerId, State, LeasedAt, Steps]
      properties:
        Id:
          type: string
          format: uuid
        Number:
          type: integer
          minimum: 1
        RunnerId:
          type: string
          format: uuid
        State:
          $ref: "#/components/schemas/JobAttemptState"
        FailureReason:
          type: string
        ExitCode:
          type: integer
        LeasedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        MutationStartedAt:
          type: string
          format: date-time
        Steps:
          type: array
          items:
            $ref: "#/components/schemas/JobAttemptStep"
    JobDetail:
      type: object
      additionalProperties: false
      required: [Job, Spec, Attempts]
      properties:
        Job:
          $ref: "#/components/schemas/Job"
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Attempts:
          type: array
          items:
            $ref: "#/components/schemas/JobAttempt"
    JobResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Job"
    JobDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/JobDetail"
    JobListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Job"
