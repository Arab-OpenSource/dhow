          $ref: "#/components/responses/Error"
  /organizations/{id}/teams/{teamId}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member from a team
      description: >-
        Needs `member.manage`, and the caller's role must be at least every role the team grants. If the member's
        effective role drops, every session of the member is revoked.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/teams/{teamId}/role-bindings:
    post:
      operationId: createRoleBinding
      tags: [teams]
      summary: Grant a role to a team
      description: >-
        Needs `member.manage`. The role is capped by the caller's own role and is never `owner`. A team has at most one
        binding per scope target. Only the `org` scope exists today; project and environment scopes arrive with
        projects. Members whose effective role rises are signed out everywhere.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleBindingRequest"
