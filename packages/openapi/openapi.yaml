        State:
          type: string
          minLength: 1
          maxLength: 256
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [Id, Provider, ProviderName, Email, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        Provider:
          $ref: "#/components/schemas/OidcProviderId"
        ProviderName:
          type: string
          description: The provider's label, or its id when the provider is no longer configured.
        Email:
          type: string
          description: The verified email the provider reported at the last sign-in, or empty.
        CreatedAt:
          type: string
          format: date-time
        LastUsedAt:
          type: string
          format: date-time
          nullable: true
    LinkedIdentityListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/LinkedIdentity"
    LinkedIdentityChange:
      type: object
      additionalProperties: false
      required: [Identity, Revoked]
      properties:
        Identity:
          $ref: "#/components/schemas/LinkedIdentity"
        Revoked:
          type: integer
          minimum: 0
          description: How many other sessions were revoked.
    LinkedIdentityChangeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/LinkedIdentityChange"
    ApiTokenScope:
      type: string
      enum: [org.read, org.update, member.read, member.manage, audit.read, runner.read, runner.manage, job.read, job.cancel]
    ApiTokenStatus:
      type: string
      enum: [active, expired, revoked, inactive]
      description: >-
        `inactive` means the creator is no longer a member of the organization, so the token does nothing until it
        expires or is revoked.
    ApiTokenOwner:
      type: object
      additionalProperties: false
      required: [Id, Name, Email]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        Email:
          type: string
    ApiToken:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, OrganizationName, Name, Scopes, Status, Owner, CreatedAt, ExpiresAt, LastUsedIp]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        OrganizationName:
          type: string
        Name:
          type: string
        Scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenScope"
        Status:
          $ref: "#/components/schemas/ApiTokenStatus"
        Owner:
          $ref: "#/components/schemas/ApiTokenOwner"
        CreatedAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
        LastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Updated at most once a minute.
        LastUsedIp:
          type: string
        RevokedAt:
          type: string
          format: date-time
          nullable: true
    ApiTokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/ApiToken"
    ApiTokenListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/ApiToken"
    CreateApiTokenRequest:
      type: object
      additionalProperties: false
      required: [Name, Scopes, ExpiresInDays, CurrentFactor]
      properties:
        Name:
          type: string
          maxLength: 400
        Scopes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/ApiTokenScope"
        ExpiresInDays:
          type: integer
          minimum: 1
          maximum: 366
          description: Every token expires. The longest is 366 days.
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    CreatedApiToken:
      type: object
      additionalProperties: false
      required: [Token, Value]
      properties:
        Token:
          $ref: "#/components/schemas/ApiToken"
        Value:
          type: string
          description: >-
            The token, `dhow_pat_` followed by 43 base64url characters. Send it as `Authorization: Bearer <value>`.
            Shown only in this response.
    CreatedApiTokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/CreatedApiToken"
    ThemeColors:
      type: object
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 7
      description: One `#rrggbb` color for every theme token, keyed by the token name (`canvas`, `t1`, `a1`, ...).
    CustomTheme:
      type: object
      additionalProperties: false
      required: [Id, Name, Colors]
      properties:
        Id:
          type: string
          maxLength: 40
        Name:
          type: string
          maxLength: 40
        Colors:
          $ref: "#/components/schemas/ThemeColors"
    SavePreferencesRequest:
      type: object
      additionalProperties: false
      required: [Locale, ThemeId, CustomThemes, OrganizationId]
      properties:
        Locale:
          $ref: "#/components/schemas/Locale"
        ThemeId:
          type: string
          maxLength: 40
        CustomThemes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CustomTheme"
        OrganizationId:
          type: string
          format: uuid
          nullable: true
    Preferences:
      type: object
      additionalProperties: false
      required: [Locale, ThemeId, CustomThemes, OrganizationId, Saved]
      properties:
        Locale:
          $ref: "#/components/schemas/Locale"
        ThemeId:
          type: string
        CustomThemes:
          type: array
          items:
            $ref: "#/components/schemas/CustomTheme"
        OrganizationId:
          type: string
          format: uuid
          nullable: true
        Saved:
          type: boolean
          description: False until the first save.
        UpdatedAt:
          type: string
          format: date-time
          nullable: true
    PreferencesResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Preferences"
    JobState:
      type: string
      enum: [queued, leased, running, succeeded, failed, canceled, timed_out, lost]
    JobAttemptState:
      type: string
      enum: [leased, running, succeeded, failed, canceled, timed_out, lost]
    JobStepState:
      type: string
      enum: [running, succeeded, failed, interrupted]
    JobIsolation:
      type: string
      enum: [container, gvisor]
    JobQueuedReason:
      type: string
      enum: [NO_MATCHING_RUNNER]
    JobStep:
      type: object
      additionalProperties: false
      required: [Name, Run]
      properties:
        Name:
          type: string
          maxLength: 100
        Run:
          type: string
          description: A shell script, run with `/bin/sh -e -s`.
        Env:
          type: object
          additionalProperties:
            type: string
        Mutating:
          type: boolean
          description: The step changes a deploy target, so the job is never retried automatically once it began.
        TimeoutSeconds:
          type: integer
          minimum: 0
          description: Zero means the job timeout.
    JobSecretRef:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          maxLength: 64
        AsEnv:
          type: string
          description: The environment variable that carries the value. Exactly one of AsEnv and AsFile.
        AsFile:
          type: string
          description: A file name under /run/dhow/secrets. Exactly one of AsEnv and AsFile.
        Steps:
          type: array
          items:
            type: integer
            minimum: 0
          description: The step indexes that see the secret. Empty means every step.
    JobResources:
      type: object
      additionalProperties: false
      properties:
        CpuMillis:
          type: integer
          format: int64
        MemoryBytes:
          type: integer
          format: int64
        Pids:
          type: integer
          format: int64
        DiskBytes:
          type: integer
          format: int64
    JobNetwork:
      type: object
      additionalProperties: false
      properties:
        Egress:
          type: array
          maxItems: 64
          items:
            type: string
          description: Hosts the job may reach through the runner proxy, as `host`, `*.host` or `host:port`. IP literals are refused.
    JobSpec:
      type: object
      additionalProperties: false
      required: [Image, Steps]
      properties:
        Image:
          type: string
          description: An image reference pinned by digest (`name@sha256:...`). A name without a registry host is completed the way Docker does it, so `node:22@sha256:...` becomes `docker.io/library/node:22@sha256:...`.
        Steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/JobStep"
        Env:
          type: object
          additionalProperties:
            type: string
          description: >-
            Plain environment for every step. Names that start with `DHOW_` are reserved. Every member who can read the job
            sees these values, viewers included, so never put a credential here: reference it from Secrets.
        Secrets:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/JobSecretRef"
        Resources:
          $ref: "#/components/schemas/JobResources"
        TimeoutSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Zero means one hour.
        Network:
          $ref: "#/components/schemas/JobNetwork"
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
          description: Every label must be on the runner, including the reserved `dhow.` capability labels.
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [Name, Spec]
      properties:
        Name:
          type: string
          maxLength: 100
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Priority:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Higher runs first among queued jobs.
        MaxInfraRetries:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
          description: How many times a job that lost its runner before any mutating step is queued again.
    Job:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, Name, State, Labels, Isolation, Priority, Image, SpecDigest, AttemptCount,
                 MaxInfraRetries, QueuedAt, QueueDeadline, CreatedAt, CreatedByUserId]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        Name:
          type: string
        State:
          $ref: "#/components/schemas/JobState"
        FailureReason:
          type: string
          description: Why the job ended the way it did, for example `QUEUE_TIMEOUT` or `LOST_AFTER_MUTATION`.
        QueuedReason:
          $ref: "#/components/schemas/JobQueuedReason"
        Labels:
          type: array
          items:
            type: string
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Priority:
          type: integer
        Image:
          type: string
        SpecDigest:
          type: string
          description: Hex SHA-256 of the normalized spec.
        AttemptCount:
          type: integer
          minimum: 0
        MaxInfraRetries:
          type: integer
          minimum: 0
        QueuedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        Deadline:
          type: string
          format: date-time
        QueueDeadline:
          type: string
          format: date-time
        CancelRequestedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        CreatedByUserId:
          type: string
          format: uuid
    JobAttemptStep:
      type: object
      additionalProperties: false
      required: [Index, Name, Mutating, State, StartedAt]
      properties:
        Index:
          type: integer
          minimum: 0
        Name:
          type: string
        Mutating:
          type: boolean
        State:
          $ref: "#/components/schemas/JobStepState"
        ExitCode:
          type: integer
        FailureReason:
          type: string
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
    JobAttempt:
      type: object
      additionalProperties: false
      required: [Id, Number, RunnerId, FencingToken, State, LeasedAt, Steps]
      properties:
        Id:
          type: string
          format: uuid
        Number:
          type: integer
          minimum: 1
        RunnerId:
          type: string
          format: uuid
        FencingToken:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The fencing token of the attempt's lease. Every attempt gets a larger one than the attempts before it, and
            the server refuses any call from a runner that holds an older token.
        State:
          $ref: "#/components/schemas/JobAttemptState"
        FailureReason:
          type: string
        ExitCode:
          type: integer
        LeasedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        MutationStartedAt:
          type: string
          format: date-time
        Steps:
          type: array
          items:
            $ref: "#/components/schemas/JobAttemptStep"
    JobDetail:
      type: object
      additionalProperties: false
      required: [Job, Spec, Attempts]
      properties:
        Job:
          $ref: "#/components/schemas/Job"
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Attempts:
          type: array
          items:
            $ref: "#/components/schemas/JobAttempt"
    JobResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Job"
    JobDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/JobDetail"
    JobLogStream:
      type: string
      enum: [stdout, stderr, system]
    JobLogChunk:
      type: object
      additionalProperties: false
      required: [Seq, Stream, CreatedAt, Text]
      properties:
        Seq:
          type: integer
          format: int64
          minimum: 1
        Stream:
          $ref: "#/components/schemas/JobLogStream"
        StepIndex:
          type: integer
          minimum: 0
        EmittedAt:
          type: string
          format: date-time
          description: The runner's clock, for display only.
        CreatedAt:
          type: string
          format: date-time
        Text:
          type: string
          description: >-
            The bytes as UTF-8 with invalid bytes replaced by U+FFFD. Render it as text, never as HTML, each line
            with `dir="auto"`.
    JobLogStatus:
      type: object
      additionalProperties: false
      required: [Attempt, State, Truncated]
      properties:
        Attempt:
          type: integer
          minimum: 1
        State:
          $ref: "#/components/schemas/JobAttemptState"
        Truncated:
          type: boolean
    JobLogPage:
      type: object
      additionalProperties: false
      required: [Attempt, AttemptId, State, LastSeq, Truncated, Chunks]
      properties:
        Attempt:
          type: integer
          minimum: 1
        AttemptId:
          type: string
          format: uuid
        State:
          $ref: "#/components/schemas/JobAttemptState"
        LastSeq:
          type: integer
          format: int64
          minimum: 0
          description: The highest sequence number the attempt has reached so far.
        Truncated:
          type: boolean
          description: The log reached `DHOW_JOB_LOG_MAX_BYTES` and later output was dropped.
        NextSeq:
          type: integer
          format: int64
          minimum: 1
          description: Pass it as `FromSeq` to read on. Absent when this page reached the end so far.
        Chunks:
          type: array
          items:
            $ref: "#/components/schemas/JobLogChunk"
    JobLogPageResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/JobLogPage"
    JobListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Job"
    OverviewJobs:
      type: object
      nullable: true
      additionalProperties: false
      required: [Running, Queued, QueuedNoRunner, FailedLast24h]
      properties:
        Running:
          type: integer
          minimum: 0
          description: Jobs in the `leased` or `running` state.
        Queued:
          type: integer
          minimum: 0
          description: Jobs in the `queued` state.
        QueuedNoRunner:
          type: integer
          minimum: 0
          description: Queued jobs with `QueuedReason` `NO_MATCHING_RUNNER`. Part of `Queued`.
        FailedLast24h:
          type: integer
          minimum: 0
          description: Jobs that finished `failed` or `timed_out` in the last 24 hours.
    OverviewRunners:
      type: object
      nullable: true
      additionalProperties: false
      required: [Online, Offline, Paused]
      properties:
        Online:
          type: integer
          minimum: 0
          description: Active runners seen in the last two minutes.
        Offline:
          type: integer
          minimum: 0
          description: Active runners not seen in the last two minutes.
        Paused:
          type: integer
          minimum: 0
          description: Disabled runners, by an admin or because a clone was suspected.
    OverviewInvitations:
      type: object
      nullable: true
      additionalProperties: false
      required: [Pending]
      properties:
        Pending:
          type: integer
          minimum: 0
          description: Invitations that are not accepted, revoked or expired.
    OrganizationOverview:
      type: object
      additionalProperties: false
      required: [Jobs, Runners, Invitations]
      properties:
        Jobs:
          $ref: "#/components/schemas/OverviewJobs"
        Runners:
          $ref: "#/components/schemas/OverviewRunners"
        Invitations:
          $ref: "#/components/schemas/OverviewInvitations"
    OrganizationOverviewResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/OrganizationOverview"
