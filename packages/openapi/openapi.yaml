    TeamChangeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/TeamChange"
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
        Description:
          type: string
          maxLength: 500
        Role:
          $ref: "#/components/schemas/BindableRole"
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
        Description:
          type: string
          maxLength: 500
    AddTeamMemberRequest:
      type: object
      additionalProperties: false
      required: [UserId]
      properties:
        UserId:
          type: string
          format: uuid
    CreateRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [Scope, Role]
      properties:
        Scope:
          $ref: "#/components/schemas/BindingScope"
        Role:
          $ref: "#/components/schemas/BindableRole"
    UpdateRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [Role]
      properties:
        Role:
          $ref: "#/components/schemas/BindableRole"
    EmailStatus:
      type: string
      enum: [disabled, sent, failed]
      description: >-
        `disabled` when SMTP is not set up, `sent` when the mail server accepted the email, `failed` when it did not.
        The link works in every case.
    Invitation:
      type: object
      additionalProperties: false
      required: [Id, Email, Role, InvitedByName, CreatedAt, ExpiresAt, SentAt, SendCount, EmailStatus, Expired]
      properties:
        Id:
          type: string
          format: uuid
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/BindableRole"
        InvitedByName:
          type: string
        CreatedAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
        SentAt:
          type: string
          format: date-time
        SendCount:
          type: integer
          minimum: 1
        EmailStatus:
          $ref: "#/components/schemas/EmailStatus"
        Expired:
          type: boolean
    InvitationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Invitation"
    InvitationListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Invitation"
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [Email, Role]
      properties:
        Email:
          type: string
          maxLength: 254
        Role:
          $ref: "#/components/schemas/BindableRole"
    InvitationIssued:
      type: object
      additionalProperties: false
      required: [Invitation, Link]
      properties:
        Invitation:
          $ref: "#/components/schemas/Invitation"
        Link:
          type: string
          description: The only copy of the link. Never stored and never logged.
    InvitationIssuedResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/InvitationIssued"
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [Token]
      properties:
        Token:
          type: string
          minLength: 1
          maxLength: 256
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [OrganizationName, InviterName, Email, Role, ExpiresAt, AccountExists]
      properties:
        OrganizationName:
          type: string
        InviterName:
          type: string
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/BindableRole"
        ExpiresAt:
          type: string
          format: date-time
        AccountExists:
          type: boolean
          description: True when the email already has an account, which accepts by signing in.
    InvitationPreviewResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/InvitationPreview"
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [Token, Name, Password]
      properties:
        Token:
          type: string
          minLength: 1
          maxLength: 256
        Name:
          type: string
          minLength: 1
          maxLength: 100
        Password:
          type: string
          maxLength: 1024
          description: 12 to 128 characters. Never returned and never logged.
        Locale:
          $ref: "#/components/schemas/Locale"
    InvitationAccepted:
      type: object
      additionalProperties: false
      required: [User, Organization, Role]
      properties:
        User:
          $ref: "#/components/schemas/User"
        Organization:
          $ref: "#/components/schemas/Organization"
        Role:
          $ref: "#/components/schemas/Role"
    InvitationAcceptedResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/InvitationAccepted"
    OidcProviderId:
      type: string
      pattern: "^[a-z][a-z0-9]{0,31}$"
      maxLength: 32
    OidcProviderKind:
      type: string
      enum: [oidc, github]
    OidcProvider:
      type: object
      additionalProperties: false
      required: [Id, Name, Kind]
      properties:
        Id:
          $ref: "#/components/schemas/OidcProviderId"
        Name:
          type: string
        Kind:
          $ref: "#/components/schemas/OidcProviderKind"
    OidcProviderListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/OidcProvider"
    OidcAuthorizeRequest:
      type: object
      additionalProperties: false
      required: [Provider]
      properties:
        Provider:
          $ref: "#/components/schemas/OidcProviderId"
    OidcLinkRequest:
      type: object
      additionalProperties: false
      required: [Provider, CurrentFactor]
      properties:
        Provider:
          $ref: "#/components/schemas/OidcProviderId"
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    OidcAuthorization:
      type: object
      additionalProperties: false
      required: [AuthorizationUrl, ExpiresAt]
      properties:
        AuthorizationUrl:
          type: string
          description: The provider's authorization endpoint with the flow parameters.
        ExpiresAt:
          type: string
          format: date-time
    OidcAuthorizationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/OidcAuthorization"
    OidcCallbackRequest:
      type: object
      additionalProperties: false
      required: [Provider, Code, State]
      properties:
        Provider:
          $ref: "#/components/schemas/OidcProviderId"
        Code:
          type: string
          minLength: 1
          maxLength: 4096
          description: The authorization code. Works once and is never logged.
        State:
          type: string
          minLength: 1
          maxLength: 256
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [Id, Provider, ProviderName, Email, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        Provider:
          $ref: "#/components/schemas/OidcProviderId"
        ProviderName:
          type: string
          description: The provider's label, or its id when the provider is no longer configured.
        Email:
          type: string
          description: The verified email the provider reported at the last sign-in, or empty.
        CreatedAt:
          type: string
          format: date-time
        LastUsedAt:
          type: string
          format: date-time
          nullable: true
    LinkedIdentityListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/LinkedIdentity"
    LinkedIdentityChange:
      type: object
      additionalProperties: false
      required: [Identity, Revoked]
      properties:
        Identity:
          $ref: "#/components/schemas/LinkedIdentity"
        Revoked:
          type: integer
          minimum: 0
          description: How many other sessions were revoked.
    LinkedIdentityChangeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/LinkedIdentityChange"
    ApiTokenScope:
      type: string
      enum: [org.read, org.update, member.read, member.manage, audit.read, runner.read, runner.manage, job.read, job.cancel]
    ApiTokenStatus:
      type: string
      enum: [active, expired, revoked, inactive]
      description: >-
        `inactive` means the creator is no longer a member of the organization, so the token does nothing until it
        expires or is revoked.
    ApiTokenOwner:
      type: object
      additionalProperties: false
      required: [Id, Name, Email]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        Email:
          type: string
    ApiToken:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, OrganizationName, Name, Scopes, Status, Owner, CreatedAt, ExpiresAt, LastUsedIp]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        OrganizationName:
          type: string
        Name:
          type: string
        Scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenScope"
        Status:
          $ref: "#/components/schemas/ApiTokenStatus"
        Owner:
          $ref: "#/components/schemas/ApiTokenOwner"
        CreatedAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
        LastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Updated at most once a minute.
        LastUsedIp:
          type: string
        RevokedAt:
          type: string
          format: date-time
          nullable: true
    ApiTokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/ApiToken"
    ApiTokenListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/ApiToken"
    CreateApiTokenRequest:
      type: object
      additionalProperties: false
      required: [Name, Scopes, ExpiresInDays, CurrentFactor]
      properties:
        Name:
          type: string
          maxLength: 400
        Scopes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/ApiTokenScope"
        ExpiresInDays:
          type: integer
          minimum: 1
          maximum: 366
          description: Every token expires. The longest is 366 days.
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    CreatedApiToken:
      type: object
      additionalProperties: false
      required: [Token, Value]
      properties:
        Token:
          $ref: "#/components/schemas/ApiToken"
        Value:
          type: string
          description: >-
            The token, `dhow_pat_` followed by 43 base64url characters. Send it as `Authorization: Bearer <value>`.
            Shown only in this response.
    CreatedApiTokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/CreatedApiToken"
    ThemeColors:
      type: object
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 7
      description: One `#rrggbb` color for every theme token, keyed by the token name (`canvas`, `t1`, `a1`, ...).
    CustomTheme:
      type: object
      additionalProperties: false
      required: [Id, Name, Colors]
      properties:
        Id:
          type: string
          maxLength: 40
        Name:
          type: string
          maxLength: 160
        Colors:
          $ref: "#/components/schemas/ThemeColors"
    SavePreferencesRequest:
      type: object
      additionalProperties: false
      required: [Locale, ThemeId, CustomThemes, OrganizationId]
      properties:
        Locale:
          $ref: "#/components/schemas/Locale"
        ThemeId:
          type: string
          maxLength: 40
        CustomThemes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CustomTheme"
        OrganizationId:
          type: string
          format: uuid
          nullable: true
    Preferences:
      type: object
      additionalProperties: false
      required: [Locale, ThemeId, CustomThemes, OrganizationId, Saved]
      properties:
        Locale:
          $ref: "#/components/schemas/Locale"
        ThemeId:
          type: string
        CustomThemes:
          type: array
          items:
            $ref: "#/components/schemas/CustomTheme"
        OrganizationId:
          type: string
          format: uuid
          nullable: true
        Saved:
          type: boolean
          description: False until the first save.
        UpdatedAt:
          type: string
          format: date-time
          nullable: true
    PreferencesResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Preferences"
    JobState:
      type: string
      enum: [queued, leased, running, succeeded, failed, canceled, timed_out, lost]
    JobAttemptState:
      type: string
      enum: [leased, running, succeeded, failed, canceled, timed_out, lost]
    JobStepState:
      type: string
      enum: [running, succeeded, failed, interrupted]
    JobIsolation:
      type: string
      enum: [container, gvisor]
    JobQueuedReason:
      type: string
      enum: [NO_MATCHING_RUNNER]
    JobStep:
      type: object
      additionalProperties: false
      required: [Name, Run]
      properties:
        Name:
          type: string
          maxLength: 100
        Run:
          type: string
          description: A shell script, run with `/bin/sh -e -s`.
        Env:
          type: object
          additionalProperties:
            type: string
        Mutating:
          type: boolean
          description: The step changes a deploy target, so the job is never retried automatically once it began.
        TimeoutSeconds:
          type: integer
          minimum: 0
          description: Zero means the job timeout.
    JobSecretRef:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          maxLength: 64
        AsEnv:
          type: string
          description: The environment variable that carries the value. Exactly one of AsEnv and AsFile.
        AsFile:
          type: string
          description: A file name under /run/dhow/secrets. Exactly one of AsEnv and AsFile.
        Steps:
          type: array
          items:
            type: integer
            minimum: 0
          description: The step indexes that see the secret. Empty means every step.
    JobResources:
      type: object
      additionalProperties: false
      properties:
        CpuMillis:
          type: integer
          format: int64
        MemoryBytes:
          type: integer
          format: int64
        Pids:
          type: integer
          format: int64
        DiskBytes:
          type: integer
          format: int64
    JobNetwork:
      type: object
      additionalProperties: false
      properties:
        Egress:
          type: array
          maxItems: 64
          items:
            type: string
          description: Hosts the job may reach through the runner proxy, as `host`, `*.host` or `host:port`. IP literals are refused.
    JobSpec:
      type: object
      additionalProperties: false
      required: [Image, Steps]
      properties:
        Image:
          type: string
          description: An image reference pinned by digest (`name@sha256:...`).
        Steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/JobStep"
        Env:
          type: object
          additionalProperties:
            type: string
          description: >-
            Plain environment for every step. Names that start with `DHOW_` are reserved. Every member who can read the job
            sees these values, viewers included, so never put a credential here: reference it from Secrets.
        Secrets:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/JobSecretRef"
        Resources:
          $ref: "#/components/schemas/JobResources"
        TimeoutSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Zero means one hour.
        Network:
          $ref: "#/components/schemas/JobNetwork"
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
          description: Every label must be on the runner, including the reserved `dhow.` capability labels.
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [Name, Spec]
      properties:
        Name:
          type: string
          maxLength: 100
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Priority:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Higher runs first among queued jobs.
        MaxInfraRetries:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
          description: How many times a job that lost its runner before any mutating step is queued again.
    Job:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, Name, State, Labels, Isolation, Priority, Image, SpecDigest, AttemptCount,
                 MaxInfraRetries, QueuedAt, QueueDeadline, CreatedAt, CreatedByUserId]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        Name:
          type: string
        State:
          $ref: "#/components/schemas/JobState"
        FailureReason:
          type: string
          description: Why the job ended the way it did, for example `QUEUE_TIMEOUT` or `LOST_AFTER_MUTATION`.
        QueuedReason:
          $ref: "#/components/schemas/JobQueuedReason"
        Labels:
          type: array
          items:
            type: string
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Priority:
          type: integer
        Image:
          type: string
        SpecDigest:
          type: string
          description: Hex SHA-256 of the normalized spec.
        AttemptCount:
          type: integer
          minimum: 0
        MaxInfraRetries:
          type: integer
          minimum: 0
        QueuedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        Deadline:
          type: string
          format: date-time
        QueueDeadline:
          type: string
          format: date-time
        CancelRequestedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        CreatedByUserId:
          type: string
          format: uuid
    JobAttemptStep:
      type: object
      additionalProperties: false
      required: [Index, Name, Mutating, State, StartedAt]
      properties:
        Index:
          type: integer
          minimum: 0
        Name:
          type: string
        Mutating:
          type: boolean
        State:
          $ref: "#/components/schemas/JobStepState"
        ExitCode:
          type: integer
        FailureReason:
          type: string
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
    JobAttempt:
      type: object
      additionalProperties: false
      required: [Id, Number, RunnerId, State, LeasedAt, Steps]
      properties:
        Id:
          type: string
          format: uuid
        Number:
          type: integer
          minimum: 1
        RunnerId:
          type: string
          format: uuid
        State:
          $ref: "#/components/schemas/JobAttemptState"
        FailureReason:
          type: string
        ExitCode:
          type: integer
        LeasedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        MutationStartedAt:
          type: string
          format: date-time
        Steps:
          type: array
          items:
            $ref: "#/components/schemas/JobAttemptStep"
    JobDetail:
      type: object
      additionalProperties: false
      required: [Job, Spec, Attempts]
      properties:
        Job:
          $ref: "#/components/schemas/Job"
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Attempts:
          type: array
          items:
            $ref: "#/components/schemas/JobAttempt"
    JobResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Job"
    JobDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/JobDetail"
    JobLogStream:
      type: string
      enum: [stdout, stderr, system]
    JobLogChunk:
      type: object
      additionalProperties: false
      required: [Seq, Stream, CreatedAt, Text]
      properties:
        Seq:
          type: integer
          format: int64
          minimum: 1
        Stream:
          $ref: "#/components/schemas/JobLogStream"
        StepIndex:
          type: integer
          minimum: 0
        EmittedAt:
          type: string
          format: date-time
          description: The runner's clock, for display only.
        CreatedAt:
          type: string
          format: date-time
        Text:
          type: string
          description: >-
            The bytes as UTF-8 with invalid bytes replaced by U+FFFD. Render it as text, never as HTML, each line
            with `dir="auto"`.
    JobLogStatus:
      type: object
      additionalProperties: false
      required: [Attempt, State, Truncated]
      properties:
        Attempt:
          type: integer
          minimum: 1
        State:
          $ref: "#/components/schemas/JobAttemptState"
        Truncated:
          type: boolean
    JobLogPage:
      type: object
      additionalProperties: false
      required: [Attempt, AttemptId, State, LastSeq, Truncated, Chunks]
      properties:
        Attempt:
          type: integer
          minimum: 1
        AttemptId:
          type: string
          format: uuid
        State:
          $ref: "#/components/schemas/JobAttemptState"
        LastSeq:
          type: integer
          format: int64
          minimum: 0
          description: The highest sequence number the attempt has reached so far.
        Truncated:
          type: boolean
          description: The log reached `DHOW_JOB_LOG_MAX_BYTES` and later output was dropped.
        NextSeq:
          type: integer
          format: int64
          minimum: 1
          description: Pass it as `FromSeq` to read on. Absent when this page reached the end so far.
        Chunks:
          type: array
          items:
            $ref: "#/components/schemas/JobLogChunk"
    JobLogPageResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/JobLogPage"
    JobListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Job"
