          $ref: "#/components/responses/Error"
  /organizations/{id}/invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List the open or accepted invitations of an organization
      description: >-
        Needs `member.manage`. With `Status=open`, the default, it lists the invitations that are neither accepted nor
        revoked; expired ones are listed with `Expired` so they can be resent. With `Status=accepted` it lists the
        accepted ones with `AcceptedAt` and who accepted them. Newest first, at most 200.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: Status
          in: query
          required: false
          description: Which invitations to list.
          schema:
            $ref: "#/components/schemas/InvitationStatus"
      responses:
        "200":
          description: The invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite someone by email
      description: >-
        Needs `member.manage`. The role is capped by the caller's own role and is never `owner`. The answer carries the
        invitation link once (`${PUBLIC_URL}/invite#<token>`); the server keeps only the token's SHA-256. The link
        works once and expires after 7 days. When SMTP is set up the link is emailed too, and `EmailStatus` says
        whether that worked: the invitation exists either way. An open invitation for the same address is
        `INVITATION_PENDING`, and an existing member is `ALREADY_MEMBER`. A member may create or resend `DHOW_RATE_LIMIT_INVITES_USER` invitations an hour and an organization
        may receive `DHOW_RATE_LIMIT_INVITES_ORG`; above either the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: The invitation and its link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationIssuedResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke an invitation
      description: Needs `member.manage` and a role at least the invited one. The link stops working at once.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: The revoked invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/invitations/{invitationId}/resend:
    post:
      operationId: resendInvitation
      tags: [invitations]
      summary: Make a new link for an invitation
      description: >-
        Needs `member.manage` and a role at least the invited one. Replaces the token, so the old link stops working,
        and starts a new 7-day period. Emails the new link when SMTP is set up. An invitation is sent at most 5 times in
        all; after that the answer is 409 `INVITATION_SEND_LIMIT`, so revoke it and invite again. A member may create or resend `DHOW_RATE_LIMIT_INVITES_USER` invitations an hour and an organization
        may receive `DHOW_RATE_LIMIT_INVITES_ORG`; above either the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: The invitation and its new link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationIssuedResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/api-tokens:
    get:
      operationId: listOrganizationApiTokens
      tags: [tokens]
      summary: Every API token of the organization
      description: Needs `token.manage` (Owner or Admin). Never contains a token value.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The tokens, newest first, at most 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiToken
      tags: [tokens]
      summary: Create an API token for this organization
      description: >-
        Needs a browser session and a current factor. Every scope must be allowed by the caller's effective role now,
        and on every later request the token can do only what both its scopes and its creator's role at that moment
        allow. The value (`dhow_pat_...`) is in this response only; the server keeps an HMAC of it. A user has at most
        50 active tokens.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "200":
          description: The token and, this once, its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiTokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/api-tokens/{tokenId}/revoke:
