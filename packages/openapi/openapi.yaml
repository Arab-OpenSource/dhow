          $ref: "#/components/schemas/Role"
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    MemberChange:
      type: object
      additionalProperties: false
      required: [UserId, Revoked]
      properties:
        UserId:
          type: string
          format: uuid
        Role:
          $ref: "#/components/schemas/Role"
        Revoked:
          type: integer
          minimum: 0
          description: How many sessions of the member were revoked.
    MemberChangeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MemberChange"
    RoleBinding:
      type: object
      additionalProperties: false
      required: [Id, Scope, Role, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        Scope:
          $ref: "#/components/schemas/BindingScope"
        Role:
          $ref: "#/components/schemas/BindableRole"
        CreatedAt:
          type: string
          format: date-time
    BindingScope:
      type: string
      enum: [org]
      description: Where a binding applies. `project` and `environment` arrive with projects.
    Team:
      type: object
      additionalProperties: false
      required: [Id, Name, Description, MemberCount, Bindings, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        Description:
          type: string
        MemberCount:
          type: integer
          minimum: 0
        Bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
        CreatedAt:
          type: string
          format: date-time
    TeamMember:
      type: object
      additionalProperties: false
      required: [UserId, Name, Email, Role, AddedAt]
      properties:
        UserId:
          type: string
          format: uuid
        Name:
          type: string
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/Role"
        AddedAt:
          type: string
          format: date-time
    TeamDetail:
      type: object
      additionalProperties: false
      required: [Id, Name, Description, MemberCount, Bindings, CreatedAt, Members]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        Description:
          type: string
        MemberCount:
          type: integer
          minimum: 0
        Bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
        CreatedAt:
          type: string
          format: date-time
        Members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
    TeamListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Team"
    TeamDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/TeamDetail"
    TeamChange:
      type: object
      additionalProperties: false
      required: [Team, Revoked]
      properties:
        Team:
          $ref: "#/components/schemas/TeamDetail"
        Revoked:
          type: integer
          minimum: 0
          description: How many sessions were revoked because an effective role changed.
    TeamChangeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/TeamChange"
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
        Description:
          type: string
          maxLength: 500
        Role:
          $ref: "#/components/schemas/BindableRole"
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
        Description:
          type: string
          maxLength: 500
    AddTeamMemberRequest:
      type: object
      additionalProperties: false
      required: [UserId]
      properties:
        UserId:
          type: string
          format: uuid
    CreateRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [Scope, Role]
      properties:
        Scope:
          $ref: "#/components/schemas/BindingScope"
        Role:
          $ref: "#/components/schemas/BindableRole"
    UpdateRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [Role]
      properties:
        Role:
          $ref: "#/components/schemas/BindableRole"
    EmailStatus:
      type: string
      enum: [disabled, sent, failed]
      description: >-
        `disabled` when SMTP is not set up, `sent` when the mail server accepted the email, `failed` when it did not.
        The link works in every case.
    Invitation:
      type: object
      additionalProperties: false
      required: [Id, Email, Role, InvitedByName, CreatedAt, ExpiresAt, SentAt, SendCount, EmailStatus, Expired]
      properties:
        Id:
          type: string
          format: uuid
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/BindableRole"
        InvitedByName:
          type: string
        CreatedAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
        SentAt:
          type: string
          format: date-time
        SendCount:
          type: integer
          minimum: 1
        EmailStatus:
          $ref: "#/components/schemas/EmailStatus"
        Expired:
          type: boolean
    InvitationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Invitation"
    InvitationListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Invitation"
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [Email, Role]
      properties:
        Email:
          type: string
          maxLength: 254
        Role:
          $ref: "#/components/schemas/BindableRole"
    InvitationIssued:
      type: object
      additionalProperties: false
      required: [Invitation, Link]
      properties:
        Invitation:
          $ref: "#/components/schemas/Invitation"
        Link:
          type: string
          description: The only copy of the link. Never stored and never logged.
    InvitationIssuedResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/InvitationIssued"
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [Token]
      properties:
        Token:
          type: string
          minLength: 1
          maxLength: 256
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [OrganizationName, InviterName, Email, Role, ExpiresAt, AccountExists]
      properties:
        OrganizationName:
          type: string
        InviterName:
          type: string
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/BindableRole"
        ExpiresAt:
          type: string
          format: date-time
        AccountExists:
          type: boolean
          description: True when the email already has an account, which accepts by signing in.
    InvitationPreviewResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/InvitationPreview"
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [Token, Name, Password]
      properties:
        Token:
          type: string
          minLength: 1
          maxLength: 256
        Name:
          type: string
          minLength: 1
          maxLength: 100
        Password:
          type: string
          maxLength: 1024
          description: 12 to 128 characters. Never returned and never logged.
        Locale:
          $ref: "#/components/schemas/Locale"
    InvitationAccepted:
      type: object
      additionalProperties: false
      required: [User, Organization, Role]
      properties:
        User:
          $ref: "#/components/schemas/User"
        Organization:
          $ref: "#/components/schemas/Organization"
        Role:
          $ref: "#/components/schemas/Role"
    InvitationAcceptedResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/InvitationAccepted"
    JobState:
      type: string
      enum: [queued, leased, running, succeeded, failed, canceled, timed_out, lost]
    JobAttemptState:
      type: string
      enum: [leased, running, succeeded, failed, canceled, timed_out, lost]
    JobStepState:
      type: string
      enum: [running, succeeded, failed, interrupted]
    JobIsolation:
      type: string
      enum: [container, gvisor]
    JobQueuedReason:
      type: string
      enum: [NO_MATCHING_RUNNER]
    JobStep:
      type: object
      additionalProperties: false
      required: [Name, Run]
      properties:
        Name:
          type: string
          maxLength: 100
        Run:
          type: string
          description: A shell script, run with `/bin/sh -e -s`.
        Env:
          type: object
          additionalProperties:
            type: string
        Mutating:
          type: boolean
          description: The step changes a deploy target, so the job is never retried automatically once it began.
        TimeoutSeconds:
          type: integer
          minimum: 0
          description: Zero means the job timeout.
    JobSecretRef:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          maxLength: 64
        AsEnv:
          type: string
          description: The environment variable that carries the value. Exactly one of AsEnv and AsFile.
        AsFile:
          type: string
          description: A file name under /run/dhow/secrets. Exactly one of AsEnv and AsFile.
        Steps:
          type: array
          items:
            type: integer
            minimum: 0
          description: The step indexes that see the secret. Empty means every step.
    JobResources:
      type: object
      additionalProperties: false
      properties:
        CpuMillis:
          type: integer
          format: int64
        MemoryBytes:
          type: integer
          format: int64
        Pids:
          type: integer
          format: int64
        DiskBytes:
          type: integer
          format: int64
    JobNetwork:
      type: object
      additionalProperties: false
      properties:
        Egress:
          type: array
          maxItems: 64
          items:
            type: string
          description: Hosts the job may reach through the runner proxy, as `host`, `*.host` or `host:port`. IP literals are refused.
    JobSpec:
      type: object
      additionalProperties: false
      required: [Image, Steps]
      properties:
        Image:
          type: string
          description: An image reference pinned by digest (`name@sha256:...`).
        Steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/JobStep"
        Env:
          type: object
          additionalProperties:
            type: string
          description: >-
            Plain environment for every step. Names that start with `DHOW_` are reserved. Every member who can read the job
            sees these values, viewers included, so never put a credential here: reference it from Secrets.
        Secrets:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/JobSecretRef"
        Resources:
          $ref: "#/components/schemas/JobResources"
        TimeoutSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Zero means one hour.
        Network:
          $ref: "#/components/schemas/JobNetwork"
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
          description: Every label must be on the runner, including the reserved `dhow.` capability labels.
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [Name, Spec]
      properties:
        Name:
          type: string
          maxLength: 100
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Priority:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Higher runs first among queued jobs.
        MaxInfraRetries:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
          description: How many times a job that lost its runner before any mutating step is queued again.
    Job:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, Name, State, Labels, Isolation, Priority, Image, SpecDigest, AttemptCount,
                 MaxInfraRetries, QueuedAt, QueueDeadline, CreatedAt, CreatedByUserId]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        Name:
          type: string
        State:
          $ref: "#/components/schemas/JobState"
        FailureReason:
          type: string
          description: Why the job ended the way it did, for example `QUEUE_TIMEOUT` or `LOST_AFTER_MUTATION`.
        QueuedReason:
          $ref: "#/components/schemas/JobQueuedReason"
        Labels:
          type: array
          items:
            type: string
        Isolation:
          $ref: "#/components/schemas/JobIsolation"
        Priority:
          type: integer
        Image:
          type: string
        SpecDigest:
          type: string
          description: Hex SHA-256 of the normalized spec.
        AttemptCount:
          type: integer
          minimum: 0
        MaxInfraRetries:
          type: integer
          minimum: 0
        QueuedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        Deadline:
          type: string
          format: date-time
        QueueDeadline:
          type: string
          format: date-time
        CancelRequestedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        CreatedByUserId:
          type: string
          format: uuid
    JobAttemptStep:
      type: object
      additionalProperties: false
      required: [Index, Name, Mutating, State, StartedAt]
      properties:
        Index:
          type: integer
          minimum: 0
        Name:
          type: string
        Mutating:
          type: boolean
        State:
          $ref: "#/components/schemas/JobStepState"
        ExitCode:
          type: integer
        FailureReason:
          type: string
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
    JobAttempt:
      type: object
      additionalProperties: false
      required: [Id, Number, RunnerId, State, LeasedAt, Steps]
      properties:
        Id:
          type: string
          format: uuid
        Number:
          type: integer
          minimum: 1
        RunnerId:
          type: string
          format: uuid
        State:
          $ref: "#/components/schemas/JobAttemptState"
        FailureReason:
          type: string
        ExitCode:
          type: integer
        LeasedAt:
          type: string
          format: date-time
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
        MutationStartedAt:
          type: string
          format: date-time
        Steps:
          type: array
          items:
            $ref: "#/components/schemas/JobAttemptStep"
    JobDetail:
      type: object
      additionalProperties: false
      required: [Job, Spec, Attempts]
      properties:
        Job:
          $ref: "#/components/schemas/Job"
        Spec:
          $ref: "#/components/schemas/JobSpec"
        Attempts:
          type: array
          items:
            $ref: "#/components/schemas/JobAttempt"
    JobResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Job"
    JobDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/JobDetail"
    JobListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Job"
