      description: >-
        `disabled` when SMTP is not set up, `sent` when the mail server accepted the email, `failed` when it did not.
        The link works in every case.
    Invitation:
      type: object
      additionalProperties: false
      required: [Id, Email, Role, InvitedByName, CreatedAt, ExpiresAt, SentAt, SendCount, EmailStatus, Expired]
      properties:
        Id:
          type: string
          format: uuid
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/BindableRole"
        InvitedByName:
          type: string
        CreatedAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
        SentAt:
          type: string
          format: date-time
        SendCount:
          type: integer
          minimum: 1
        EmailStatus:
          $ref: "#/components/schemas/EmailStatus"
        Expired:
          type: boolean
        AcceptedAt:
          type: string
          format: date-time
          description: When the invitation was accepted. Present only with `Status=accepted`.
        AcceptedByUserId:
          type: string
          format: uuid
          description: The user who accepted the invitation. Present only with `Status=accepted`.
        AcceptedByName:
          type: string
          description: The name of the user who accepted the invitation. Present only with `Status=accepted`.
    InvitationStatus:
      type: string
