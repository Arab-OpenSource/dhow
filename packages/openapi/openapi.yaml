  /organizations/{id}/second-factor-rule:
    put:
      operationId: updateSecondFactorRule
      tags: [identity]
      summary: Choose who must use two-step verification
      description: >-
        Needs `org.security` (owners only), a current factor of the caller, and a second factor on the caller's own
        account (`SECOND_FACTOR_REQUIRED` otherwise). `admins` covers owners and admins, `everyone` covers every role.
        A covered member without TOTP or a passkey has seven days from the moment the rule reached them or from
        joining, whichever is later; after that `org.update`, `org.transfer`, `org.security`, `member.manage`,
        `runner.manage`, `job.create` and `token.create` answer `403 SECOND_FACTOR_REQUIRED`, for sessions and API
        tokens alike, until the member sets one up. Reading stays allowed.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecondFactorRuleRequest"
      responses:
        "200":
          description: The organization with the new rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/members:
    get:
      operationId: listMembers
      tags: [identity]
      summary: List the members of an organization
      description: Needs `member.read`. A caller who is not a member gets 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
