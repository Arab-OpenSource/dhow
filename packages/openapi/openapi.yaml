  /invitations/preview:
    post:
      operationId: previewInvitation
      tags: [invitations]
      summary: Read what an invitation link offers
      description: >-
        Public. The token travels in the body, never in the URL, so it stays out of access logs. An unknown, used,
        revoked or expired token, or one whose inviter no longer has the authority to invite, is `INVITATION_INVALID`
        with nothing else. Limited per client network (an IPv4 address or an IPv6 /64) with `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes,
        shared with `POST /invitations/accept`; above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreviewResponse"
        default:
          $ref: "#/components/responses/Error"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation with a new account
      description: >-
        Public. Creates the account for the invited email with the given name and password (12 to 128 characters,
        checked against known breaches) and adds it to the organization at the invited role. The token works once:
        two parallel calls never both succeed. An address that already has an account is `INVITATION_ACCOUNT_EXISTS`:
        sign in and use `POST /me/invitations/accept`. No session is created; sign in afterwards. Limited per client network (an IPv4 address or an IPv6 /64) with `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes,
        shared with `POST /invitations/preview`; above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: The account was created and joined the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAcceptedResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/invitations/accept:
    post:
      operationId: acceptInvitationSignedIn
      tags: [invitations]
      summary: Accept an invitation as the signed-in user
      description: >-
        The invitation's email must be the signed-in user's email (`INVITATION_EMAIL_MISMATCH` otherwise). A user is
        never added to an organization because of a matching email alone: the token is always required.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: The user joined the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAcceptedResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List the audit events of an organization
      description: >-
        Needs `audit.read`. Newest first. A caller who is not a member gets 404. Every filter is optional and they
        combine with AND; `Meta.Total` counts the matching events. A `From` later than `To`, or an unknown `Category`,
        is `VALIDATION_FAILED`.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/AuditCategory"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/audit-events/{eventId}:
    get:
      operationId: getAuditEvent
      tags: [audit]
      summary: Read one audit event of an organization
      description: Needs `audit.read`. An event of another organization, or an unknown id, is 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The audit event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/audit-events/verify:
    get:
      operationId: verifyAuditChain
      tags: [audit]
      summary: Verify the hash chain of an organization's audit log
      description: >-
        Needs `audit.read`. Walks the chain from the oldest event and reports the first event whose hash or link is
        wrong.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerifyResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runners:
    get:
      operationId: listRunners
      tags: [runners]
      summary: List the runners of an organization
      description: >-
        Needs `runner.read`. Newest first. `Status` is computed: `online` when the runner was seen in the last two
        minutes. Never contains a key or a token. A caller who is not a member gets 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of runners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerListResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runners/{runnerId}:
    get:
      operationId: getRunner
      tags: [runners]
      summary: Read a runner
      description: Needs `runner.read`. Never contains a key or a token. A runner of another organization gets 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RunnerId"
      responses:
        "200":
          description: The runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRunner
      tags: [runners]
      summary: Rename a runner, change its labels, or disable and enable it
      description: >-
        Needs `runner.manage`. A disabled runner gets no new jobs and finishes the running ones. Labels that start with
        `dhow.` are reserved for capabilities the runner reports. A revoked runner answers 409 `RUNNER_REVOKED`.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RunnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRunnerRequest"
      responses:
        "200":
          description: The updated runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runners/{runnerId}/revoke:
    post:
      operationId: revokeRunner
      tags: [runners]
      summary: Revoke a runner for good
      description: >-
        Needs `runner.manage`. Ends every session of the runner, so its next call is refused. Revoking is final and
        idempotent: the runner has to register again with a new identity.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RunnerId"
      responses:
        "200":
          description: The revoked runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runner-registration-tokens:
    get:
      operationId: listRunnerRegistrationTokens
      tags: [runners]
      summary: List the runner registration tokens of an organization
      description: Needs `runner.manage`. Metadata only, the token itself is never shown again.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of registration tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerRegistrationTokenListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRunnerRegistrationToken
      tags: [runners]
      summary: Create a runner registration token
      description: >-
        Needs `runner.manage`. The token is returned once, in this response only, together with the command that
        registers a runner. It is valid for one use and one hour by default, for at most 50 uses and 24 hours.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunnerRegistrationTokenRequest"
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRunnerRegistrationTokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/runner-registration-tokens/{tokenId}/revoke:
    post:
      operationId: revokeRunnerRegistrationToken
      tags: [runners]
      summary: Revoke a runner registration token
      description: Needs `runner.manage`. Idempotent. Runners already registered with it keep working.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TokenId"
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerRegistrationTokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List the jobs of an organization
      description: >-
        Needs `job.read`. Newest first, optionally filtered by one or more states. A queued job that no active runner of the
        organization can take carries `QueuedReason` `NO_MATCHING_RUNNER`, as in the job itself. A caller who is not a
        member gets 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/JobStateFilter"
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job from a job spec
      description: >-
        Needs `job.create`. The spec is validated and normalized (defaults filled in) and the job is queued. The image
        must be pinned by digest. A spec that references secrets is refused with 422 `SECRETS_UNAVAILABLE` while no
        secret store is configured, and an organization with 1000 queued jobs gets 429 `JOB_QUEUE_FULL`. API tokens cannot create jobs.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Read a job with its spec, attempts and steps
      description: >-
        Needs `job.read`. A queued job that no active runner of the organization can take carries `QueuedReason`
        `NO_MATCHING_RUNNER`. A job of another organization gets 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetailResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job
      description: >-
        Needs `job.cancel`. Idempotent. A queued job is canceled at once. A leased or running job is marked, its runner
        sees the request on its next heartbeat and no step may begin after it. A job that already finished in another
        state answers 409 `JOB_FINISHED`.
      security:
        - SessionCookie: []
          CsrfToken: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/jobs/{jobId}/logs:
    get:
      operationId: getJobLogs
      tags: [jobs]
      summary: Read a page of the log of a job attempt
      description: >-
        Needs `log.read`, which a viewer does not have. Reads the chunks of one attempt (the latest without `Attempt`)
        from `FromSeq` on, in order. A page holds at most `Limit` chunks and about 1 MiB of text, and `NextSeq` is
        set while more chunks follow. `Text` is the stored bytes as UTF-8, with every invalid byte replaced by
        U+FFFD. A job without that attempt answers 404 `ATTEMPT_NOT_FOUND`, and a job of another organization 404
        `NOT_FOUND`. More than about 5 pages a second from one user answers 429 `RATE_LIMITED` with `Retry-After`.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/LogAttempt"
        - $ref: "#/components/parameters/LogFromSeq"
        - $ref: "#/components/parameters/LogLimit"
      responses:
        "200":
          description: A page of the log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLogPageResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/jobs/{jobId}/logs/stream:
    get:
      operationId: streamJobLogs
      tags: [jobs]
      summary: Follow the log of a job attempt as server-sent events
      description: >-
        Needs `log.read`. Streams the chunks of one attempt (the latest without `Attempt`) after `Last-Event-ID`,
        or from `FromSeq`, or from the start. Events: `chunk` (its `id` is `<attempt>:<seq>` and its data a
        `JobLogChunk`),
        `status` (data `JobLogStatus`, sent first and on every change of the attempt) and `end` (data
        `JobLogStatus`, after the last chunk of a finished attempt; the stream then closes). A comment arrives every
        15 seconds, and the session is checked again each time, so a signed-out or revoked session ends the stream
        within 15 seconds; the check never extends the session. One user may hold 10 streams, one organization a tenth
        of `DHOW_SSE_MAX_STREAMS` (at least 20) and one server instance `DHOW_SSE_MAX_STREAMS`; more answer 429
        `TOO_MANY_STREAMS` with `Retry-After`. Opening streams quickly one after another answers 429 `RATE_LIMITED`. A
        client that cannot keep up is disconnected and resumes with `Last-Event-ID`.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/LogAttempt"
        - $ref: "#/components/parameters/LogFromSeq"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /organizations/{id}/overview:
    get:
      operationId: getOrganizationOverview
      tags: [overview]
      summary: Counts of what needs attention in an organization
      description: >-
        Needs `org.read`. One request for the home page and the sidebar counters, so the client does not page through
        every list to count. Each block needs the same permission as its list: `Jobs` needs `job.read`, `Runners`
        needs `runner.read` and `Invitations` needs `member.manage`. A block the caller may not read is `null`, never
        zero, so the client can tell "none" from "not yours to see". `Jobs.Running` counts the `leased` and `running`
        states. `Jobs.QueuedNoRunner` counts queued jobs whose `QueuedReason` is `NO_MATCHING_RUNNER`.
        `Jobs.FailedLast24h` counts the `failed` and `timed_out` states that finished in the last 24 hours.
        `Runners.Online` and `Runners.Offline` follow the `Status` rule of the runners list (seen in the last two
        minutes) for active runners, and `Runners.Paused` counts disabled runners. Revoked runners are not counted.
        `Invitations.Pending` counts invitations that are not accepted, revoked or expired. A caller who is not a
        member gets 404.
      security:
        - SessionCookie: []
        - ApiToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The counts the caller may read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationOverviewResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings:
    get:
      operationId: getInstanceSettings
      tags: [settings]
      summary: Every dashboard setting, with where each value comes from
      description: >-
        Needs `instance.settings.manage` (the instance owner only, never an API token). Each setting carries its
        effective `Value`, its `Source` (`env`, `database` or `default`), `Locked` (true when an environment variable
        sets it) and `Env`, the name of that variable. A secret never comes back: it is `{Set, Locked, Env}` only.
        Each group carries the `Version` to send back when you change it.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The settings of every group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/mail:
    put:
      operationId: updateMailSettings
      tags: [settings]
      summary: Change the mail settings
      description: >-
        Needs `instance.settings.manage`, a second factor on the caller's account (`SECOND_FACTOR_REQUIRED`
        otherwise) and a fresh `CurrentFactor`. Send only the fields you change. A field you leave out keeps its value.
        An empty string removes a field from the database, so it goes back to its default. For `Password`, leave it
        out to keep the saved password, send a new value to replace it, or send an empty string to clear it. A field
        set by an environment variable answers `409 SETTING_LOCKED_BY_ENV`, a stale `Version` answers
        `409 SETTING_CHANGED`, and a bad value answers `400 SETTING_INVALID` with the field and the reason.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/mail/test:
    post:
      operationId: sendTestMail
      tags: [settings]
      summary: Send a test email to the caller
      description: >-
        Needs `instance.settings.manage`. Sends one short message to the caller's own address with the mail settings
        in effect now. Five tests per user in ten minutes (`429 RATE_LIMITED` after that). Mail that is off answers
        `409 MAIL_NOT_CONFIGURED`, and a mail server that refuses answers `502 MAIL_TEST_FAILED`; the reason is in
        the server log, never in the response.
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The address the message went to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailTestResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/organizations:
    put:
      operationId: updateOrganizationSettings
      tags: [settings]
      summary: Choose who may create organizations
      description: Same rules as `PUT /instance/settings/mail`.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/passwords:
    put:
      operationId: updatePasswordSettings
      tags: [settings]
      summary: Turn the breached-password check on or off
      description: Same rules as `PUT /instance/settings/mail`.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/rate-limits:
    put:
      operationId: updateRateLimitSettings
      tags: [settings]
      summary: Change the rate limits
      description: Same rules as `PUT /instance/settings/mail`.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRateLimitSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/logs:
    put:
      operationId: updateLogSettings
      tags: [settings]
      summary: Change how long job logs are kept and how large one attempt's log may grow
      description: >-
        Same rules as `PUT /instance/settings/mail`. A new `JobLogMaxBytes` applies to attempts that start after the
        change; a running attempt keeps the limit it started with.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLogSettingsRequest"
      responses:
        "200":
          description: Every group, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/oidc:
    get:
      operationId: getOidcSettings
      tags: [settings]
      summary: The sign-in providers, where they come from and how many accounts use each
      description: >-
        Needs `instance.settings.manage`. When `DHOW_OIDC_PROVIDERS` is set in the environment, every provider comes
        from the environment (`Source: env`, `Locked: true`) and the dashboard cannot change them; providers saved in
        the database are then unused and only counted in `IgnoredStored`. Otherwise the providers come from the
        database. A client secret never comes back: it is `{Set, Saved, Locked, Env}` only. `LinkedIdentities` counts
        the accounts linked to the provider, and `OnlySignInUsers` counts the accounts that can sign in with nothing
        else, so removing or disabling the provider would lock them out.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The sign-in providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOidcProvider
      tags: [settings]
      summary: Add a sign-in provider
      description: >-
        Needs `instance.settings.manage`, a second factor on the caller's account and a fresh `CurrentFactor`. The `Id`
        is part of the callback URL and of linked accounts, so it never changes later. Providers from the environment
        answer `409 SETTING_LOCKED_BY_ENV`, an `Id` in use answers `409 OIDC_PROVIDER_EXISTS`, an eleventh provider
        answers `409 OIDC_PROVIDER_LIMIT`, an `Id` whose old linked accounts use another issuer answers
        `409 OIDC_PROVIDER_LINKED`, and a bad value answers `400 SETTING_INVALID` with the field and the reason.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOidcProviderRequest"
      responses:
        "200":
          description: Every provider, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/oidc/test:
    post:
      operationId: testOidcProvider
      tags: [settings]
      summary: Check that the server can reach an identity provider
      description: >-
        Needs `instance.settings.manage`. For `oidc`, fetches the discovery document of `Issuer`, checks that its
        endpoints use https, and fetches the signing keys. For `github`, calls the API of `Issuer`. The client secret is
        never sent anywhere. Five tests per user in ten minutes (`429 RATE_LIMITED` after that). An issuer that is not
        valid, or that points at a link-local or cloud metadata address, answers `400 SETTING_INVALID`. The reason for a
        failed check is in the server log, never in the response.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestOidcProviderRequest"
      responses:
        "200":
          description: Which checks passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcTestResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/oidc/{providerId}:
    put:
      operationId: updateOidcProvider
      tags: [settings]
      summary: Change a sign-in provider
      description: >-
        Same rules as `POST /instance/settings/oidc`, with the provider's `Version` (`409 SETTING_CHANGED` when stale).
        Send only the fields you change. `Type` and `Issuer` cannot change once accounts are linked to the provider
        (`409 OIDC_PROVIDER_LINKED`): add a new provider instead. For `ClientSecret`, leave it out to keep it, send a
        value to replace it, or send "" to clear it, which turns the provider off. Turning off a provider that some
        accounts need to sign in answers `409 OIDC_PROVIDER_ONLY_SIGN_IN` with the number of accounts in `Details`.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOidcProviderRequest"
      responses:
        "200":
          description: Every provider, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
  /instance/settings/oidc/{providerId}/remove:
    post:
      operationId: removeOidcProvider
      tags: [settings]
      summary: Remove a sign-in provider
      description: >-
        Needs `instance.settings.manage` and a fresh `CurrentFactor`, with the provider's `Version`. The provider is
        soft deleted: accounts linked to it keep the link, see it on their account page and can unlink it. When some
        accounts can sign in with nothing else, the server refuses with `409 OIDC_PROVIDER_ONLY_SIGN_IN` and the number
        of accounts in `Details`. Sessions that are already open stay open.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveOidcProviderRequest"
      responses:
        "200":
          description: Every provider, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcSettingsResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-dhow_session
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    ApiToken:
      type: http
      scheme: bearer
      description: >-
        A personal API token. Accepted only on the routes that list it, never together with a session cookie, and
        without the CSRF token or the Origin check because a browser never sends it on its own.
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9]{0,31}$"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditCategory:
      name: Category
      in: query
      required: false
      description: Only events whose action starts with this category, such as `auth` for `auth.login`.
      schema:
        $ref: "#/components/schemas/AuditCategory"
    AuditAction:
      name: Action
      in: query
      required: false
      description: Only events with exactly this action.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditActor:
      name: ActorUserId
      in: query
      required: false
      description: Only events done by this user.
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: From
      in: query
      required: false
      description: Only events at or after this time.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: To
      in: query
      required: false
      description: Only events before this time.
      schema:
        type: string
        format: date-time
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogAttempt:
      name: Attempt
      in: query
      required: false
      description: The attempt number. Without it, the latest attempt.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    LogFromSeq:
      name: FromSeq
      in: query
      required: false
      description: The first chunk to return.
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
    LogLimit:
      name: Limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        The `id` of the last chunk event the client received, `<attempt>:<seq>`. When it names the attempt the stream
        follows, the stream resumes after that seq and ignores `FromSeq`. An id of another attempt (the job was retried
        while the client was away) is ignored, so the new attempt starts from `FromSeq` or the beginning.
      schema:
        type: string
        maxLength: 32
        pattern: "^[0-9]{1,10}:[0-9]{1,19}$"
    JobStateFilter:
      name: State
      in: query
      required: false
      description: >-
        Keep only jobs in these states. Repeat the parameter (`State=failed&State=timed_out`) or separate the states
        with commas (`State=failed,timed_out`). An unknown state is refused with 422 `VALIDATION_FAILED`.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 8
        items:
          type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: Page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: Limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Error:
      description: An error. Never contains internal details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SettingSource:
      type: string
      enum: [env, database, default]
      description: Where the value in effect comes from. An environment variable wins over the database.
    StringSetting:
      type: object
      additionalProperties: false
      required: [Value, Source, Locked, Env]
      properties:
        Value:
          type: string
        Source:
          $ref: "#/components/schemas/SettingSource"
        Locked:
          type: boolean
          description: True when the environment variable `Env` sets it. The dashboard cannot change it then.
        LockedBy:
          type: string
          description: >-
            The environment variable that locks this setting: `Env` itself, or `DHOW_SMTP_PASSWORD` for the mail
            server, port and encryption when the SMTP password comes from the environment. Absent when not locked.
        Env:
          type: string
          example: DHOW_SMTP_HOST
    IntegerSetting:
      type: object
      additionalProperties: false
      required: [Value, Source, Locked, Env]
      properties:
        Value:
          type: integer
          format: int64
        Source:
          $ref: "#/components/schemas/SettingSource"
        Locked:
          type: boolean
        LockedBy:
          type: string
          description: >-
            The environment variable that locks this setting: `Env` itself, or `DHOW_SMTP_PASSWORD` for the mail
            server, port and encryption when the SMTP password comes from the environment. Absent when not locked.
        Env:
          type: string
    BooleanSetting:
      type: object
      additionalProperties: false
      required: [Value, Source, Locked, Env]
      properties:
        Value:
          type: boolean
        Source:
          $ref: "#/components/schemas/SettingSource"
        Locked:
          type: boolean
        LockedBy:
          type: string
          description: >-
            The environment variable that locks this setting: `Env` itself, or `DHOW_SMTP_PASSWORD` for the mail
            server, port and encryption when the SMTP password comes from the environment. Absent when not locked.
        Env:
          type: string
    SecretSetting:
      type: object
      additionalProperties: false
      required: [Set, Locked, Env, Saved]
      description: A write-only secret. Its value never comes back, only whether one is set.
      properties:
        Set:
          type: boolean
          description: True when a value is in effect, from the environment or the database.
        Saved:
          type: boolean
          description: >-
            True when a copy is saved in the database. With `Locked`, that copy is unused, and sending "" removes it.
        Locked:
          type: boolean
        Env:
          type: string
    MailSettings:
      type: object
      additionalProperties: false
      required: [Version, Host, Port, Tls, Username, Password, From]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        Host:
          $ref: "#/components/schemas/StringSetting"
        Port:
          $ref: "#/components/schemas/IntegerSetting"
        Tls:
          $ref: "#/components/schemas/StringSetting"
        Username:
          $ref: "#/components/schemas/StringSetting"
        Password:
          $ref: "#/components/schemas/SecretSetting"
        From:
          $ref: "#/components/schemas/StringSetting"
    OrganizationSettings:
      type: object
      additionalProperties: false
      required: [Version, Creation]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        Creation:
          $ref: "#/components/schemas/StringSetting"
    PasswordSettings:
      type: object
      additionalProperties: false
      required: [Version, BreachedCheck]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        BreachedCheck:
          $ref: "#/components/schemas/BooleanSetting"
    RateLimitSettings:
      type: object
      additionalProperties: false
      required: [Version, Public, InvitesPerUser, InvitesPerOrganization]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        Public:
          $ref: "#/components/schemas/IntegerSetting"
        InvitesPerUser:
          $ref: "#/components/schemas/IntegerSetting"
        InvitesPerOrganization:
          $ref: "#/components/schemas/IntegerSetting"
    LogSettings:
      type: object
      additionalProperties: false
      required: [Version, RetentionDays, JobLogMaxBytes]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        RetentionDays:
          $ref: "#/components/schemas/IntegerSetting"
        JobLogMaxBytes:
          $ref: "#/components/schemas/IntegerSetting"
    InstanceSettings:
      type: object
      additionalProperties: false
      required: [Mail, Organizations, Passwords, RateLimits, Logs]
      properties:
        Mail:
          $ref: "#/components/schemas/MailSettings"
        Organizations:
          $ref: "#/components/schemas/OrganizationSettings"
        Passwords:
          $ref: "#/components/schemas/PasswordSettings"
        RateLimits:
          $ref: "#/components/schemas/RateLimitSettings"
        Logs:
          $ref: "#/components/schemas/LogSettings"
    InstanceSettingsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/InstanceSettings"
    UpdateMailSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Host:
          type: string
          maxLength: 253
        Port:
          type: integer
          minimum: 1
          maximum: 65535
        Tls:
          type: string
          enum: [starttls, tls, none]
        Username:
          type: string
          maxLength: 320
        Password:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
          description: >-
            Leave out to keep the saved password, send a value to replace it, or send "" to clear it. When `Host`
            changes and a password is saved, send the password again (`400 SETTING_INVALID` otherwise), so a saved
            password never goes to a new server without the owner typing it. When `DHOW_SMTP_PASSWORD` is set in the
            environment, `Host`, `Port` and `Tls` are locked too (`409 SETTING_LOCKED_BY_ENV`), and "" only removes
            the unused database copy. From the dashboard, `Tls` may be `none` only for a loopback host.
        From:
          type: string
          maxLength: 320
    UpdateOrganizationSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Creation:
          type: string
          enum: [instance-owner, any-user]
    UpdatePasswordSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        BreachedCheck:
          type: boolean
    UpdateRateLimitSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Public:
          type: integer
          minimum: 1
          maximum: 100000
        InvitesPerUser:
          type: integer
          minimum: 1
          maximum: 100000
        InvitesPerOrganization:
          type: integer
          minimum: 1
          maximum: 100000
    UpdateLogSettingsRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        RetentionDays:
          type: integer
          minimum: 1
          maximum: 3650
        JobLogMaxBytes:
          type: integer
          format: int64
          minimum: 1048576
          maximum: 1073741824
    MailTest:
      type: object
      additionalProperties: false
      required: [SentTo]
      properties:
        SentTo:
          type: string
          format: email
    MailTestResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MailTest"
    OidcProviderType:
      type: string
      enum: [oidc, github]
      description: "`oidc` for any OpenID Connect provider, Google included; `github` for GitHub or GitHub Enterprise Server."
    OidcProviderSetting:
      type: object
      additionalProperties: false
      required: [Id, Type, Name, Issuer, ClientId, ClientSecret, AllowedDomains, Enabled, Version, LinkedIdentities, OnlySignInUsers, CallbackUrl]
      properties:
        Id:
          type: string
        Type:
          $ref: "#/components/schemas/OidcProviderType"
        Name:
          type: string
        Issuer:
          type: string
        ClientId:
          type: string
        ClientSecret:
          $ref: "#/components/schemas/SecretSetting"
        AllowedDomains:
          type: array
          items:
            type: string
        Enabled:
          type: boolean
          description: False when the client secret is cleared. The sign-in page shows enabled providers only.
        Version:
          type: integer
          format: int64
          minimum: 0
        LinkedIdentities:
          type: integer
          format: int64
          minimum: 0
        OnlySignInUsers:
          type: integer
          format: int64
          minimum: 0
          description: Accounts that can sign in only with this provider.
        CallbackUrl:
          type: string
          description: The redirect URL to register at the identity provider.
        UpdatedAt:
          type: string
          format: date-time
    OidcSettings:
      type: object
      additionalProperties: false
      required: [Source, Locked, Env, CallbackBase, MaxProviders, IgnoredStored, Providers]
      properties:
        Source:
          $ref: "#/components/schemas/SettingSource"
        Locked:
          type: boolean
          description: True when `DHOW_OIDC_PROVIDERS` is set. The whole list then comes from the environment.
        Env:
          type: string
          example: DHOW_OIDC_PROVIDERS
        CallbackBase:
          type: string
          description: The callback URL without the provider id, such as `https://dhow.example.com/oidc/callback/`.
        MaxProviders:
          type: integer
        IgnoredStored:
          type: integer
          format: int64
          minimum: 0
          description: Providers saved in the database that are unused because the environment sets the list.
        Providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProviderSetting"
    OidcSettingsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/OidcSettings"
    CreateOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [CurrentFactor, Id, Type, ClientId, ClientSecret]
      properties:
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Id:
          type: string
          pattern: "^[a-z][a-z0-9]{0,31}$"
        Type:
          $ref: "#/components/schemas/OidcProviderType"
        Name:
          type: string
          maxLength: 40
          description: The label on the sign-in button, at most 40 characters. Empty takes the id, or GitHub.
        Issuer:
          type: string
          maxLength: 2048
          description: Required for `oidc`. Empty for `github` means https://github.com.
        ClientId:
          type: string
          maxLength: 512
        ClientSecret:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
        AllowedDomains:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
    UpdateOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
        Type:
          $ref: "#/components/schemas/OidcProviderType"
        Name:
          type: string
          maxLength: 40
        Issuer:
          type: string
          maxLength: 2048
        ClientId:
          type: string
          maxLength: 512
        ClientSecret:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
          description: Leave out to keep the secret, send a value to replace it, or send "" to clear it and turn the provider off.
        AllowedDomains:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
    RemoveOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [Version, CurrentFactor]
      properties:
        Version:
          type: integer
          format: int64
          minimum: 0
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    TestOidcProviderRequest:
      type: object
      additionalProperties: false
      required: [Type]
      properties:
        Type:
          $ref: "#/components/schemas/OidcProviderType"
        Issuer:
          type: string
          maxLength: 2048
    OidcTestCheck:
      type: object
      additionalProperties: false
      required: [Check, Passed]
      properties:
        Check:
          type: string
          enum: [discovery, endpoints, keys, api]
          description: >-
            `discovery`: the server reached the issuer and read its discovery document. `endpoints`: every endpoint in
            it uses https. `keys`: the signing keys were fetched. `api`: the GitHub API answered.
        Passed:
          type: boolean
    OidcTest:
      type: object
      additionalProperties: false
      required: [Passed, Checks]
      properties:
        Passed:
          type: boolean
        Checks:
          type: array
          items:
            $ref: "#/components/schemas/OidcTestCheck"
    OidcTestResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/OidcTest"
    Envelope:
      type: object
      required: [Success]
      properties:
        Success:
          type: boolean
        Message:
          type: string
          description: An i18n key such as `system.meta.loaded`. The client translates it.
          example: system.meta.loaded
        Meta:
          $ref: "#/components/schemas/PageMeta"
        Error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [Error]
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/HealthStatus"
    MetaResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Meta"
    PageMeta:
      type: object
      additionalProperties: false
      required: [Page, Limit, Total]
      properties:
        Page:
          type: integer
          minimum: 1
        Limit:
          type: integer
          minimum: 1
        Total:
          type: integer
          minimum: 0
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [Code, Message]
      properties:
        Code:
          type: string
          description: >-
            Stable machine-readable UPPER_SNAKE code: `INTERNAL`, `NOT_FOUND`, `METHOD_NOT_ALLOWED`,
            `BAD_REQUEST`, `VALIDATION_FAILED`, `PAYLOAD_TOO_LARGE`, `SERVICE_UNAVAILABLE`, `UNAUTHENTICATED`,
            `FORBIDDEN`, `CSRF_FAILED`, `INVALID_CREDENTIALS`, `INVALID_CURRENT_PASSWORD`, `PASSWORD_BREACHED`,
            `SETUP_COMPLETED`, `SETUP_TOKEN_INVALID`, `CONFLICT`, `MFA_CHALLENGE_EXPIRED`, `INVALID_MFA_CODE`,
            `INVALID_CURRENT_FACTOR`, `ENROLLMENT_EXPIRED`, `PASSKEY_REJECTED`, `LAST_OWNER`, `ROLE_NOT_ALLOWED`,
            `ALREADY_MEMBER`, `INVITATION_PENDING`, `INVITATION_INVALID`, `INVITATION_EMAIL_MISMATCH`,
            `INVITATION_ACCOUNT_EXISTS`, `SECOND_FACTOR_REQUIRED`, `SETTING_LOCKED_BY_ENV`, `SETTING_CHANGED`,
            `SETTING_INVALID`, `MAIL_NOT_CONFIGURED`, `MAIL_TEST_FAILED`, `OIDC_PROVIDER_EXISTS`, `OIDC_PROVIDER_LIMIT`,
            `OIDC_PROVIDER_LINKED` or `OIDC_PROVIDER_ONLY_SIGN_IN`.
          example: INTERNAL
        Message:
          type: string
          description: Message translated by the server for the Accept-Language locale (Arabic by default).
          example: Something went wrong. Try again later.
        Details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFieldDetail"
    ErrorFieldDetail:
      type: object
      additionalProperties: false
      required: [Field, Message]
      properties:
        Field:
          type: string
        Message:
          type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required: [Status, Checks]
      properties:
        Status:
          type: string
          enum: [ok, unavailable]
        Checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      additionalProperties: false
      required: [Name, Ok]
      properties:
        Name:
          type: string
          enum: [database, migrations, log_partitions, settings]
        Ok:
          type: boolean
    Meta:
      type: object
      additionalProperties: false
      required: [Version, Commit, SetupRequired]
      properties:
        Version:
          type: string
          example: v0.1.0
        Commit:
          type: string
          example: 2e39188
        SetupRequired:
          type: boolean
          description: True until the first owner completes setup.
    SetupRequest:
      type: object
      additionalProperties: false
      required: [SetupToken, OwnerName, Email, Password, OrganizationName, OrganizationSlug]
      properties:
        SetupToken:
          type: string
          minLength: 1
          maxLength: 256
        OwnerName:
          type: string
          minLength: 1
          maxLength: 100
        Email:
          type: string
          maxLength: 254
        Password:
          type: string
          maxLength: 1024
          description: 12 to 128 characters. Never returned and never logged.
        OrganizationName:
          type: string
          minLength: 1
          maxLength: 100
        OrganizationSlug:
          type: string
          maxLength: 63
          description: Lowercase letters, digits and single hyphens. Unique among organizations.
        Locale:
          $ref: "#/components/schemas/Locale"
    SetupResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/SetupResult"
    SetupResult:
      type: object
      additionalProperties: false
      required: [User, Organization]
      properties:
        User:
          $ref: "#/components/schemas/User"
        Organization:
          $ref: "#/components/schemas/Organization"
    Locale:
      type: string
      enum: [ar, en]
    User:
      type: object
      additionalProperties: false
      required: [Id, Email, Name, Locale]
      properties:
        Id:
          type: string
          format: uuid
        Email:
          type: string
        Name:
          type: string
        Locale:
          $ref: "#/components/schemas/Locale"
    Role:
      type: string
      enum: [owner, admin, maintainer, developer, viewer]
    Organization:
      type: object
      additionalProperties: false
      required: [Id, Name, Slug, CreatedAt, RequireSecondFactor]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        Slug:
          type: string
        CreatedAt:
          type: string
          format: date-time
        RequireSecondFactor:
          $ref: "#/components/schemas/SecondFactorRule"
        RequireSecondFactorSince:
          type: string
          format: date-time
          description: When the rule last reached more roles. Absent while the rule is `off`.
    SecondFactorRule:
      type: string
      enum: [off, admins, everyone]
      description: Who must use two-step verification in the organization.
    UpdateSecondFactorRuleRequest:
      type: object
      additionalProperties: false
      required: [RequireSecondFactor, CurrentFactor]
      properties:
        RequireSecondFactor:
          $ref: "#/components/schemas/SecondFactorRule"
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    OrganizationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Organization"
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 100
    Member:
      type: object
      additionalProperties: false
      required: [UserId, Name, Email, Role, EffectiveRole, JoinedAt, Teams]
      properties:
        UserId:
          type: string
          format: uuid
        Name:
          type: string
        Email:
          type: string
        Role:
          $ref: "#/components/schemas/Role"
        EffectiveRole:
          $ref: "#/components/schemas/Role"
          description: The higher of the direct role and every role the member's teams grant in the organization.
        JoinedAt:
          type: string
          format: date-time
        LastActiveAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The last time the member used the dashboard: the newest `LastSeenAt` of their sign-in sessions, which the
            server updates at most once a minute. Absent when no session is left, for example a member who never signed
            in. It comes from the same query as the page of members and needs `member.read`, like the list.
        Mfa:
          $ref: "#/components/schemas/MfaState"
          description: The member's strongest second factor. Present only for callers with `member.manage`.
        MfaResetPending:
          type: boolean
          description: An admin reset the member's second factor and the member has not set up a new one yet.
        Teams:
          type: array
          description: >-
            The teams of the organization the member belongs to, by name. It needs `member.read`, like the list itself
            and the teams list, and comes from the same query as the page of members.
          items:
            $ref: "#/components/schemas/MemberTeam"
    MemberTeam:
      type: object
      additionalProperties: false
      required: [Id, Name]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
    MemberListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Member"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [Email, Password]
      properties:
        Email:
          type: string
          maxLength: 254
        Password:
          type: string
          maxLength: 1024
          description: Never returned and never logged.
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/LoginResult"
    LoginResult:
      type: object
      additionalProperties: false
      required: [User, CsrfToken, ExpiresAt]
      properties:
        User:
          $ref: "#/components/schemas/User"
        CsrfToken:
          type: string
          description: Send as the `X-CSRF-Token` header on every non-GET request.
        ExpiresAt:
          type: string
          format: date-time
          description: When the session ends at the latest (absolute timeout).
    MembershipView:
      description: >-
        One organization of the user. `Role` is the effective role: the higher of the direct role and every role the
        user's teams grant there.
      type: object
      additionalProperties: false
      required: [OrganizationId, OrganizationName, OrganizationSlug, Role]
      properties:
        OrganizationId:
          type: string
          format: uuid
        OrganizationName:
          type: string
        OrganizationSlug:
          type: string
        Role:
          $ref: "#/components/schemas/Role"
        SecondFactorDue:
          type: string
          format: date-time
          description: >-
            Present when the organization requires two-step verification for this role and the user has neither TOTP
            nor a passkey. Sensitive actions there answer `SECOND_FACTOR_REQUIRED` from this moment on.
    MeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Me"
    Me:
      type: object
      additionalProperties: false
      required: [User, Memberships, CsrfToken, SessionId, ExpiresAt, CanCreateOrganizations, InstanceOwner, MfaReenrollRequired]
      properties:
        User:
          $ref: "#/components/schemas/User"
        Memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipView"
        CsrfToken:
          type: string
        SessionId:
          type: string
          format: uuid
        ExpiresAt:
          type: string
          format: date-time
        CanCreateOrganizations:
          type: boolean
          description: True when this user may call `POST /organizations`.
        InstanceOwner:
          type: boolean
          description: True when this user owns the server and may manage its settings (`instance.settings.manage`).
        MfaReenrollRequired:
          type: boolean
          description: An admin reset this user's second factor, and a new one is not set up yet.
    SessionView:
      type: object
      additionalProperties: false
      required: [Id, CreatedAt, LastSeenAt, ExpiresAt, UserAgent, IpAddress, Current]
      properties:
        Id:
          type: string
          format: uuid
        CreatedAt:
          type: string
          format: date-time
        LastSeenAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
        UserAgent:
          type: string
        IpAddress:
          type: string
        Current:
          type: boolean
    SessionListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/SessionView"
    RevokedCountResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RevokedCount"
    RevokedCount:
      type: object
      additionalProperties: false
      required: [Revoked]
      properties:
        Revoked:
          type: integer
          minimum: 0
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [CurrentPassword, NewPassword]
      properties:
        CurrentPassword:
          type: string
          maxLength: 1024
        NewPassword:
          type: string
          maxLength: 1024
          description: 12 to 128 characters.
    AuditEvent:
      type: object
      additionalProperties: false
      required: [Id, CreatedAt, Action, TargetType, TargetId, Ip, Data]
      properties:
        Id:
          type: string
          format: uuid
        CreatedAt:
          type: string
          format: date-time
        OrganizationId:
          type: string
          format: uuid
        ActorUserId:
          type: string
          format: uuid
        Action:
          type: string
          example: auth.login
        TargetType:
          type: string
        TargetId:
          type: string
        Ip:
          type: string
        Data:
          type: object
          additionalProperties:
            type: string
          description: Context of the event. Never contains a secret.
    AuditCategory:
      type: string
      enum: [auth, identity, runner, job, system]
    AuditEventResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/AuditEvent"
    AuditEventListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
    AuditVerifyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/AuditVerifyResult"
    AuditVerifyResult:
      type: object
      additionalProperties: false
      required: [Valid, Checked]
      properties:
        Valid:
          type: boolean
        Checked:
          type: integer
          minimum: 0
        FirstBrokenId:
          type: string
          format: uuid
    MfaMethod:
      type: string
      enum: [totp, recovery_code, passkey]
    FactorMethod:
      type: string
      enum: [password, totp, recovery_code, passkey]
    WebAuthnJson:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      description: >-
        A W3C WebAuthn JSON structure (`PublicKeyCredentialCreationOptionsJSON`, `PublicKeyCredentialRequestOptionsJSON`
        or the `toJSON()` form of a `PublicKeyCredential`). It keeps the camelCase names of the WebAuthn specification,
        the only place where the API does not use PascalCase.
    MfaPending:
      type: object
      additionalProperties: false
      required: [Methods, ExpiresAt]
      properties:
        Methods:
          type: array
          items:
            $ref: "#/components/schemas/MfaMethod"
          description: The second factors this account can use.
        ExpiresAt:
          type: string
          format: date-time
    MfaPendingResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MfaPending"
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required: [Method]
      properties:
        Method:
          $ref: "#/components/schemas/MfaMethod"
        Code:
          type: string
          maxLength: 64
          description: The TOTP code or the recovery code. Never logged.
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [Options, ExpiresAt]
      properties:
        Options:
          $ref: "#/components/schemas/WebAuthnJson"
        ExpiresAt:
          type: string
          format: date-time
    PasskeyOptionsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/PasskeyOptions"
    PasskeyChallenge:
      type: object
      additionalProperties: false
      required: [ChallengeId, Options, ExpiresAt]
      properties:
        ChallengeId:
          type: string
          format: uuid
        Options:
          $ref: "#/components/schemas/WebAuthnJson"
        ExpiresAt:
          type: string
          format: date-time
    PasskeyChallengeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/PasskeyChallenge"
    PasskeyLoginRequest:
      type: object
      additionalProperties: false
      required: [ChallengeId, Credential]
      properties:
        ChallengeId:
          type: string
          format: uuid
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    CurrentFactor:
      type: object
      additionalProperties: false
      required: [Method]
      description: >-
        Proof of a factor the user already has. `password` is accepted only while the account has no second factor;
        afterwards one of `totp`, `recovery_code` or `passkey` is required. A wrong factor answers
        `INVALID_CURRENT_FACTOR` and is throttled like a sign-in attempt.
      properties:
        Method:
          $ref: "#/components/schemas/FactorMethod"
        Password:
          type: string
          maxLength: 1024
        Code:
          type: string
          maxLength: 64
        ChallengeId:
          type: string
          format: uuid
          description: From `POST /me/mfa/passkey-options`, for method `passkey`.
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
    CurrentFactorRequest:
      type: object
      additionalProperties: false
      required: [CurrentFactor]
      properties:
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    MfaStatus:
      type: object
      additionalProperties: false
      required: [Enabled, TotpEnabled, RecoveryCodesRemaining, PasskeyCount]
      properties:
        Enabled:
          type: boolean
          description: True when the account has TOTP or at least one passkey.
        TotpEnabled:
          type: boolean
        TotpEnabledAt:
          type: string
          format: date-time
        RecoveryCodesRemaining:
          type: integer
          minimum: 0
        PasskeyCount:
          type: integer
          minimum: 0
    MfaStatusResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MfaStatus"
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [Secret, Uri, ExpiresAt]
      properties:
        Secret:
          type: string
          description: Base32 without padding. Shown once, for typing by hand.
        Uri:
          type: string
          description: The `otpauth://totp/...` URI for the QR code. Drawn by the client, never sent to a third party.
        ExpiresAt:
          type: string
          format: date-time
    TotpEnrollmentResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/TotpEnrollment"
    ConfirmTotpRequest:
      type: object
      additionalProperties: false
      required: [Code, CurrentFactor]
      properties:
        Code:
          type: string
          maxLength: 64
          description: A code from the new authenticator.
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    MfaChange:
      type: object
      additionalProperties: false
      required: [Revoked]
      properties:
        Revoked:
          type: integer
          minimum: 0
          description: How many other sessions were revoked.
        RecoveryCodes:
          type: array
          items:
            type: string
          description: New recovery codes. Present only when new codes were made, and shown only this once.
    MfaChangeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/MfaChange"
    Passkey:
      type: object
      additionalProperties: false
      required: [Id, Name, CreatedAt, Transports, Synced]
      properties:
        Id:
          type: string
          format: uuid
        Name:
          type: string
        CreatedAt:
          type: string
          format: date-time
        LastUsedAt:
          type: string
          format: date-time
        Transports:
          type: array
          items:
            type: string
        Synced:
          type: boolean
          description: The authenticator reported the credential as backup eligible (a synced passkey).
    PasskeyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Passkey"
    PasskeyListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Passkey"
    AddPasskeyRequest:
      type: object
      additionalProperties: false
      required: [ChallengeId, Credential, Name, CurrentFactor]
      properties:
        ChallengeId:
          type: string
          format: uuid
        Credential:
          $ref: "#/components/schemas/WebAuthnJson"
        Name:
          type: string
          minLength: 1
          maxLength: 64
        CurrentFactor:
          $ref: "#/components/schemas/CurrentFactor"
    AddPasskeyResult:
      type: object
      additionalProperties: false
      required: [Passkey, Revoked]
      properties:
        Passkey:
          $ref: "#/components/schemas/Passkey"
        Revoked:
          type: integer
          minimum: 0
        RecoveryCodes:
          type: array
          items:
            type: string
    AddPasskeyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/AddPasskeyResult"
    RenamePasskeyRequest:
      type: object
      additionalProperties: false
      required: [Name]
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 64
    RunnerState:
      type: string
      enum: [active, disabled, revoked]
    RunnerStatus:
      type: string
      enum: [online, offline, disabled, revoked]
      description: Computed from the state and from when the runner was last seen (online within two minutes).
    RunnerDisabledReason:
      type: string
      enum: [manual, clone_suspected]
    RunnerIsolation:
      type: string
      enum: [container, gvisor]
    Runner:
      type: object
      additionalProperties: false
      required: [Id, OrganizationId, Name, Labels, CapabilityLabels, Os, Arch, Version, IsolationLevels, Capacity, State,
                 Status, KeyVersion, KeysRotatedAt, CreatedAt]
      properties:
        Id:
          type: string
          format: uuid
        OrganizationId:
          type: string
          format: uuid
        Name:
          type: string
        Labels:
          type: array
          items:
            type: string
          description: Labels chosen by an administrator. They decide which jobs the runner may take.
        CapabilityLabels:
          type: array
          items:
            type: string
          description: Reported by the runner, with the reserved `dhow.` prefix, for example `dhow.os=linux`.
        Os:
          type: string
        Arch:
          type: string
        Version:
          type: string
        IsolationLevels:
          type: array
          items:
            $ref: "#/components/schemas/RunnerIsolation"
        Capacity:
          type: integer
          minimum: 1
          maximum: 16
        State:
          $ref: "#/components/schemas/RunnerState"
        Status:
          $ref: "#/components/schemas/RunnerStatus"
        DisabledReason:
          $ref: "#/components/schemas/RunnerDisabledReason"
        KeyVersion:
          type: integer
          minimum: 1
        KeysRotatedAt:
          type: string
          format: date-time
        LastSeenAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        RevokedAt:
          type: string
          format: date-time
    RunnerResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/Runner"
    RunnerListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/Runner"
    UpdateRunnerRequest:
      type: object
      additionalProperties: false
      properties:
        Name:
          type: string
          maxLength: 100
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
        Disabled:
          type: boolean
    RunnerRegistrationTokenStatus:
      type: string
      enum: [active, expired, used_up, revoked]
    RunnerRegistrationToken:
      type: object
      additionalProperties: false
      required: [Id, Description, Labels, MaxUses, Uses, ExpiresAt, Status, CreatedAt, CreatedByUserId]
      properties:
        Id:
          type: string
          format: uuid
        Description:
          type: string
        Labels:
          type: array
          items:
            type: string
        MaxUses:
          type: integer
          minimum: 1
          maximum: 50
        Uses:
          type: integer
          minimum: 0
        ExpiresAt:
          type: string
          format: date-time
        Status:
          $ref: "#/components/schemas/RunnerRegistrationTokenStatus"
        CreatedAt:
          type: string
          format: date-time
        CreatedByUserId:
          type: string
          format: uuid
        LastUsedAt:
          type: string
          format: date-time
        RevokedAt:
          type: string
          format: date-time
    RunnerRegistrationTokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/RunnerRegistrationToken"
    RunnerRegistrationTokenListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: array
              items:
                $ref: "#/components/schemas/RunnerRegistrationToken"
    CreateRunnerRegistrationTokenRequest:
      type: object
      additionalProperties: false
      properties:
        Description:
          type: string
          maxLength: 200
        Labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
        MaxUses:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
        ExpiresInSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
    CreatedRunnerRegistrationToken:
      type: object
      additionalProperties: false
      required: [RegistrationToken, Token, RegisterCommand]
      properties:
        RegistrationToken:
          $ref: "#/components/schemas/RunnerRegistrationToken"
        Token:
          type: string
