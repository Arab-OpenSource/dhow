openapi: 3.0.3
info:
  title: Dhow API
  version: 0.1.0
  description: |
    Public REST API of the Dhow control plane. This file is the source of truth (spec-first):
    change it, run `make gen`, then implement. JSON field names are PascalCase and path segments are kebab-case.
    Every response uses the envelope: Success is required, and Data, Message, Meta and Error are omitted when absent.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
tags:
  - name: system
    description: Health and instance metadata. Served by the System module.
  - name: identity
    description: First-owner setup and organizations. Served by the Identity module.
  - name: members
    description: Member roles, removal and the admin reset of a lost second factor. Served by the Identity module.
  - name: teams
    description: Teams, team membership and the roles teams grant (role bindings). Served by the Identity module.
  - name: invitations
    description: Email invitations, by link and optional SMTP, and accepting them. Served by the Identity module.
  - name: session
    description: Sign-in, sign-out, the current user, own sessions and password change. Served by the Session module.
  - name: mfa
    description: >-
      The second sign-in step, TOTP, recovery codes and passkeys (WebAuthn). Served by the Session module, because the
      second step is part of signing in.
  - name: oidc
    description: >-
      Sign-in with external identity providers (OpenID Connect, and GitHub over OAuth 2.0) and the identities linked to
      an account. Served by the Session module, because signing in opens a session.
  - name: tokens
    description: >-
      Personal API tokens (`dhow_pat_...`) for the CLI, CI and integrations, scoped to one organization. Served by the
      Tokens module. Routes marked with `ApiToken` also accept `Authorization: Bearer <token>` instead of a session.
  - name: preferences
    description: The signed-in user's language, themes and chosen organization. Served by the Preferences module.
  - name: audit
    description: The tamper-evident audit log. Served by the Audit module.
  - name: runners
    description: >-
      Runners and their registration tokens. Served by the Runners module. Runners themselves talk to the server over
      Connect on /runner-api/, not over this API.
  - name: jobs
    description: >-
      Jobs, their attempts and steps. Served by the Jobs module. In M3 a job is created directly from a job spec; runners
      lease jobs over Connect on /runner-api/.
  - name: overview
    description: >-
      Counts for the home page and the sidebar, in one request. Served by the Overview module, which reads the jobs,
      runners and invitations tables and never writes them.
  - name: settings
    description: >-
      Server settings that the instance owner changes from the dashboard (ADR-0063): mail, organization creation, the
      breached-password check, rate limits and log limits. Served by the Settings module. An environment variable
      always wins and locks its setting.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [system]
      summary: Liveness probe
      description: Returns 200 while the process is running. Does not touch dependencies.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe
      description: >-
        Returns 200 when the database is reachable and fully migrated, today's job log partition exists, and the
        last reload of the instance settings succeeded, otherwise 503. A failed settings reload is retried with a
        bounded backoff, and the `settings` check recovers on the next successful reload.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: >-
            Not ready. Success is false, Error carries the code `SERVICE_UNAVAILABLE`, and Data names each
            failing check without internal details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"
  /meta:
    get:
      operationId: getMeta
      tags: [system]
      summary: Instance metadata
      description: Public information the UI needs before sign-in.
      security: []
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: setupInstance
      tags: [identity]
      summary: Create the first owner and organization
      description: >-
        Works only while no owner exists. The setup token is the one logged at boot as
        `${PUBLIC_URL}/setup#<token>`, is valid for one hour and is single use. The request is atomic: two concurrent
        calls can never both succeed. The response sets no session: sign in afterwards. Limited per client network with
        `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes; above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: The owner and the organization were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    post:
      operationId: login
      tags: [session]
      summary: Sign in with email and password
      description: >-
        Failure is always `INVALID_CREDENTIALS` with the same body whether the account exists or not. A throttled
        account or address gets the same error plus a `Retry-After` header. Success sets the
        `__Host-dhow_session` cookie (`HttpOnly; Secure; SameSite=Strict; Path=/`), replaces any session cookie the
        request carried, and returns the CSRF token the client must send as `X-CSRF-Token` on every non-GET request.
        When the account has a second factor (TOTP or a passkey), a correct password answers 202 instead: no session
        is created, and the `__Host-dhow_mfa` cookie carries a challenge that is valid for 5 minutes, works once and
        is bound to the user and the browser. Only `POST /sessions/mfa` turns it into a session. On top of that lockout, each client network may send `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes;
        above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "202":
          description: The password is right and the second step is required.
          headers:
            Set-Cookie:
              description: The `__Host-dhow_mfa` challenge cookie (`HttpOnly; Secure; SameSite=Strict; Path=/`).
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaPendingResponse"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSessions
      tags: [session]
      summary: List the signed-in user's own sessions
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Active sessions of the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/current:
    delete:
      operationId: logout
      tags: [session]
      summary: Sign out of the current session
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The session was revoked and the cookie cleared.
          headers:
            Set-Cookie:
              description: An expired session cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        default:
          $ref: "#/components/responses/Error"
  /sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [session]
      summary: Sign out of every other device
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: Every session except the current one was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedCountResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [session]
      summary: Revoke one of the user's own sessions
      description: Another user's session id answers 404, exactly like an id that does not exist.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        default:
          $ref: "#/components/responses/Error"
  /sessions/mfa:
    post:
      operationId: completeMfaLogin
      tags: [mfa]
      summary: Finish signing in with the second factor
      description: >-
        Needs the `__Host-dhow_mfa` cookie from `POST /sessions`; the user comes from that challenge, never from the
        request. Accepts a TOTP code, an unused recovery code or a passkey assertion (after
        `POST /sessions/mfa/passkey-options`). A missing, expired, used or foreign-browser challenge answers
        `MFA_CHALLENGE_EXPIRED`. A wrong factor answers `INVALID_MFA_CODE` whatever the reason; attempts are throttled
        per account and per address like the password, and a throttled attempt adds `Retry-After`. Success sets the
        session cookie and clears the challenge cookie. On top of that lockout, each client network may send `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes;
        above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaLoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie, plus an expired `__Host-dhow_mfa` cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/mfa/passkey-options:
    post:
      operationId: beginMfaPasskey
      tags: [mfa]
      summary: Passkey request options for the second step
      description: >-
        Needs the `__Host-dhow_mfa` cookie. Returns WebAuthn request options for the user's passkeys and binds their
        challenge to the pending sign-in. The options keep the W3C WebAuthn JSON names.
      security: []
      responses:
        "200":
          description: Options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptionsResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/passkey-options:
    post:
      operationId: beginPasskeyLogin
      tags: [mfa]
      summary: Passkey request options for signing in without a password
      description: >-
        Starts a discoverable-credential ceremony with user verification required. The challenge is stored on the
        server, lives 5 minutes and works once. Limited per client network (an IPv4 address or an IPv6 /64) with `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes;
        above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      responses:
        "200":
          description: The challenge id and options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallengeResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/passkey:
    post:
      operationId: passkeyLogin
      tags: [mfa]
      summary: Sign in with a passkey
      description: >-
        Verifies the assertion against the stored challenge, the configured RP ID and origin, and the stored public
        key and sign count. Any failure answers `INVALID_CREDENTIALS`. Success sets the session cookie. Each client network may send `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes, shared with
        `POST /sessions/passkey-options`;
        above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/mfa:
    get:
      operationId: getMfaStatus
      tags: [mfa]
      summary: Which second factors the signed-in user has
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The second-factor status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStatusResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/mfa/passkey-options:
    post:
      operationId: beginStepUpPasskey
      tags: [mfa]
      summary: Passkey request options to confirm a change with a passkey
      description: >-
        For a `CurrentFactor` of method `passkey`. The challenge is bound to the user and the current session, lives 5
        minutes and works once.
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The challenge id and options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallengeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/totp:
    post:
      operationId: startTotpEnrollment
      tags: [mfa]
      summary: Start turning on TOTP (or replacing it)
      description: >-
        Generates a new secret on the server and stores it encrypted. The secret and its `otpauth://` URI are returned
        once so the client can draw a QR code; nothing is active until `POST /me/totp/confirm`. A pending enrollment
        lives 10 minutes and belongs to the session that started it.
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The pending enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollmentResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [mfa]
      summary: Turn TOTP on with a code from the new app
      description: >-
        Needs a code from the new authenticator and a current factor: the password when the account has no second
        factor yet, otherwise a TOTP code, a recovery code or a passkey. Replaces an existing TOTP, revokes every other
        session and, for the first second factor, returns 10 recovery codes once.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTotpRequest"
      responses:
        "200":
          description: TOTP is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/totp/disable:
    post:
      operationId: disableTotp
      tags: [mfa]
      summary: Turn TOTP off
      description: >-
        Needs a current second factor. Revokes every other session. When no second factor is left, the recovery codes
        are removed too.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: TOTP is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [mfa]
      summary: Replace the recovery codes
      description: >-
        Needs a current second factor. Returns 10 new codes once (each carries 80 random bits and works once); the old
        codes stop working. Revokes every other session.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: The new codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys:
    get:
      operationId: listPasskeys
      tags: [mfa]
      summary: List the signed-in user's passkeys
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The passkeys, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addPasskey
      tags: [mfa]
      summary: Register a passkey
      description: >-
        Needs the challenge from `POST /me/passkeys/options`, the attestation from `navigator.credentials.create()` and
        a current factor (the password when the account has no second factor yet). Revokes every other session and,
        for the first second factor, returns 10 recovery codes once.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasskeyRequest"
      responses:
        "200":
          description: The passkey was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPasskeyResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/options:
    post:
      operationId: beginPasskeyRegistration
      tags: [mfa]
      summary: Passkey creation options
      description: >-
        Requires a discoverable credential, prefers user verification and excludes the user's existing passkeys. The
        challenge is bound to the user and the current session, lives 5 minutes and works once.
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: The challenge id and options for `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallengeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/{id}:
    patch:
      operationId: renamePasskey
      tags: [mfa]
      summary: Rename one of the user's passkeys
      description: Another user's passkey id answers 404, exactly like an id that does not exist.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePasskeyRequest"
      responses:
        "200":
          description: The renamed passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/passkeys/{id}/remove:
    post:
      operationId: removePasskey
      tags: [mfa]
      summary: Remove one of the user's passkeys
      description: >-
        Needs a current second factor. Revokes every other session. When no second factor is left, the recovery codes
        are removed too. Another user's passkey id answers 404.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: The passkey was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      tags: [session]
      summary: The signed-in user, memberships and CSRF token
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: The signed-in user's display preferences
      description: >-
        The language, the active theme, the custom themes and the chosen organization. `Saved` is false until the user
        saves preferences for the first time, so the web app can move what it kept in the browser to the server. An
        organization the user is no longer a member of comes back as null.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: savePreferences
      tags: [preferences]
      summary: Replace the signed-in user's display preferences
      description: >-
        Replaces every field. `ThemeId` must name a system theme or one of `CustomThemes`. A custom theme sets every
        theme color as lower-case `#rrggbb`. `OrganizationId` must be an organization the user belongs to, or null.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePreferencesRequest"
      responses:
        "200":
          description: The saved preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    put:
      operationId: changePassword
      tags: [session]
      summary: Change the signed-in user's password
      description: >-
        Needs the current password. The new one is 12 to 128 characters, must differ from the current one and must not
        appear in a known breach (Have I Been Pwned k-anonymity range check, when enabled). Every other session of the
        user is revoked.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: The password was changed and the other sessions were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedCountResponse"
        default:
          $ref: "#/components/responses/Error"
  /oidc/providers:
    get:
      operationId: listOidcProviders
      tags: [oidc]
      summary: The external sign-in providers this instance offers
      description: Lists the providers from `DHOW_OIDC_PROVIDERS` in their configured order. Never contains a secret.
      security: []
      responses:
        "200":
          description: The configured providers, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderListResponse"
        default:
          $ref: "#/components/responses/Error"
  /oidc/authorize:
    post:
      operationId: beginOidcLogin
      tags: [oidc]
      summary: Start signing in with an external provider
      description: >-
        Returns the provider's authorization URL with PKCE (S256), a state and, for OpenID Connect, a nonce. Sets the
        `__Host-dhow_oidc` cookie (`HttpOnly; Secure; SameSite=Strict; Path=/`, 10 minutes) that binds the flow to this
        browser. The browser then opens the URL, and the provider sends it back to `/oidc/callback/<provider>`. Limited per client network (an IPv4 address or an IPv6 /64) with `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes,
        shared with `POST /oidc/callback`; above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcAuthorizeRequest"
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Set-Cookie:
              description: The `__Host-dhow_oidc` flow cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcAuthorizationResponse"
        default:
          $ref: "#/components/responses/Error"
  /oidc/callback:
    post:
      operationId: completeOidcLogin
      tags: [oidc]
      summary: Finish signing in with an external provider
      description: >-
        Needs the `__Host-dhow_oidc` cookie of the flow and the `Code` and `State` the provider returned. The flow works
        once, whatever the outcome. The identity is matched by issuer and subject only, never by email; an identity that
        is not linked to an account answers `OIDC_NOT_LINKED`. An account with a second factor answers 202 with the same
        `mfa_pending` challenge as the password step. Success sets the session cookie and replaces any session the
        request carried. Limited per client network (an IPv4 address or an IPv6 /64) with `DHOW_RATE_LIMIT_PUBLIC` requests per 10 minutes,
        shared with `POST /oidc/authorize`; above it the answer is 429 `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcCallbackRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie, and an expired flow cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "202":
          description: The identity is right and the second step is required.
          headers:
            Set-Cookie:
              description: The `__Host-dhow_mfa` challenge cookie, and an expired flow cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaPendingResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/identities:
    get:
      operationId: listLinkedIdentities
      tags: [oidc]
      summary: The external identities linked to the signed-in user
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The linked identities, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedIdentityListResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/identities/authorize:
    post:
      operationId: beginOidcLink
      tags: [oidc]
      summary: Start linking an external identity
      description: >-
        Needs a current factor, like adding a passkey. The flow is bound to this session and this browser, and an account
        links at most one identity per provider.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcLinkRequest"
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Set-Cookie:
              description: The `__Host-dhow_oidc` flow cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcAuthorizationResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/identities/callback:
    post:
      operationId: completeOidcLink
      tags: [oidc]
      summary: Finish linking an external identity
      description: >-
        Needs the flow cookie from the same session. An identity already linked to any account answers
        `OIDC_IDENTITY_IN_USE`. Revokes every other session of the user.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcCallbackRequest"
      responses:
        "200":
          description: The identity was linked.
          headers:
            Set-Cookie:
              description: An expired flow cookie.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedIdentityChangeResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/identities/{id}/remove:
    post:
      operationId: removeLinkedIdentity
      tags: [oidc]
      summary: Unlink an external identity
      description: >-
        Needs a current factor. Refused with `LAST_SIGN_IN_METHOD` when the account would have no way left to sign in.
        Revokes every other session. Another user's identity id answers 404.
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentFactorRequest"
      responses:
        "200":
          description: The identity was unlinked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedCountResponse"
        default:
          $ref: "#/components/responses/Error"
  /organizations:
    post:
      operationId: createOrganization
