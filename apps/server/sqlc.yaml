version: "2"
sql:
  - engine: postgresql
    schema: internal/Database/Migrations
    queries:
      - internal/Modules/System/Queries
      - internal/Modules/Identity/Queries
      - internal/Modules/Session/Queries
      - internal/Modules/Audit/Queries
      - internal/Modules/Runners/Queries
      - internal/Modules/Tokens/Queries
      - internal/Modules/Preferences/Queries
      - internal/Modules/Jobs/Queries
      - internal/Core/RateLimit/Queries
    gen:
      go:
        package: sqlc
        out: internal/Database/Sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
