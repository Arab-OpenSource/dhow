version: 1
name: web
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    image: node:22-bookworm@sha256:61bb7a95b0f3650f3039c0fcabe07674458cf0d13afa51aade6188bab8215b07
    steps:
      - run: npm ci
      - run: npm test
  build:
    needs: [test]
    image: node:22-bookworm@sha256:61bb7a95b0f3650f3039c0fcabe07674458cf0d13afa51aade6188bab8215b07
    strategy:
      matrix:
        os: [debian, alpine]
    steps:
      - run: npm run build
    artifacts:
      - name: ${{ "web-" + matrix.os }}
        paths: [dist]
