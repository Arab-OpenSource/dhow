name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/khaymah/dhow

jobs:
  image:
    name: Build, sign and attest the image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the version and tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $REF_NAME is not a semantic version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          version="${REF_NAME#v}"
          tags="${IMAGE_NAME}:${version}"
          if [[ "$version" != *-* ]]; then
            tags+=$'\n'"${IMAGE_NAME}:latest"
          fi
          {
            echo "version=$version"
            echo "tags<<DHOW_TAGS_EOF"
            echo "$tags"
            echo "DHOW_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Smoke test the tagged commit
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: make smoke IMAGE=dhow:release-check
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: false
          sbom: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$IDENTITY" \
            "${IMAGE_NAME}@${DIGEST}" > /dev/null
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dhow.spdx.json
          upload-artifact: false
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dhow.spdx.json
          push-to-registry: true
      - name: Attest the SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhow-sbom-spdx
          path: dhow.spdx.json
          if-no-files-found: error

  binaries:
    name: Build the Linux binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the version
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $REF_NAME is not a semantic version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enable pnpm from the packageManager field
        run: corepack enable
      - name: Build the web app into the embed directory
        run: make web
      - name: Build the archives and SHA256SUMS
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: make dist VERSION="$VERSION" COMMIT="$COMMIT"
      - name: Check that a second build is byte for byte identical
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          DIST_DIR="$RUNNER_TEMP/dist-again" make dist VERSION="$VERSION" COMMIT="$COMMIT"
          diff dist/SHA256SUMS "$RUNNER_TEMP/dist-again/SHA256SUMS"
      - name: Check the archives
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          for component in server runner; do
            for arch in amd64 arm64; do
              grep -Eq "^[0-9a-f]{64}  dhow-${component}_${VERSION}_linux_${arch}\.tar\.gz$" dist/SHA256SUMS
            done
          done
          tar -xzf "dist/dhow-server_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP" dhow-server
          go version -m "$RUNNER_TEMP/dhow-server" | grep -q 'CGO_ENABLED=0'
          "$RUNNER_TEMP/dhow-server" install --help
          tar -xzf "dist/dhow-runner_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP" dhow-runner dhow-runner.service
          go version -m "$RUNNER_TEMP/dhow-runner" | grep -q 'CGO_ENABLED=0'
          "$RUNNER_TEMP/dhow-runner" version | grep -qF "dhow-runner $VERSION "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhow-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-binaries:
    name: Sign, attest and publish the binaries
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.binaries.outputs.version }}
      IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dhow-binaries
          path: dist
      - name: Check the archives against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Verify the signature
        working-directory: dist
        run: |
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$IDENTITY" \
            SHA256SUMS
      - name: Install the signed runner archive with get.sh, as users will
        env:
          REPO: ${{ github.repository }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/good/v$VERSION" "$site/forged/v$VERSION"
          cp dist/dhow-runner_"${VERSION}"_linux_amd64.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sigstore.json "$site/good/v$VERSION/"
          cp "$site/good/v$VERSION/"* "$site/forged/v$VERSION/"
          printf '%064d  dhow-extra.tar.gz\n' 0 >>"$site/forged/v$VERSION/SHA256SUMS"
          openssl req -x509 -newkey ed25519 -nodes -days 1 -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/ca.pem" 2>/dev/null
          (cd "$site" && exec openssl s_server -quiet -accept 127.0.0.1:18444 -cert "$RUNNER_TEMP/ca.pem" -key "$RUNNER_TEMP/key.pem" -WWW) >/dev/null 2>&1 &
          sleep 1
          export CURL_CA_BUNDLE="$RUNNER_TEMP/ca.pem" DHOW_REPO="$REPO"
          DHOW_DOWNLOAD_URL=https://127.0.0.1:18444/good bash deploy/install/get.sh --component runner --version "$VERSION" 2>&1 | tee "$RUNNER_TEMP/get.log"
          grep -q 'SHA256SUMS is signed by the dhow release workflow' "$RUNNER_TEMP/get.log"
          /usr/local/bin/dhow-runner version | grep -qF "dhow-runner $VERSION "
          systemd-analyze security --no-pager dhow-runner.service | tail -1
          if DHOW_DOWNLOAD_URL=https://127.0.0.1:18444/forged bash deploy/install/get.sh --component runner --version "$VERSION" >"$RUNNER_TEMP/forged.log" 2>&1; then
            echo "::error::get.sh accepted a SHA256SUMS the release workflow did not sign"
            exit 1
          fi
          grep -q 'the signature on SHA256SUMS does not verify' "$RUNNER_TEMP/forged.log"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: Generate an SPDX SBOM per archive
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for archive in dist/*.tar.gz; do
            unpacked="$RUNNER_TEMP/sbom/$(basename "$archive" .tar.gz)"
            mkdir -p "$unpacked"
            tar -xzf "$archive" -C "$unpacked"
            "$SYFT" scan "dir:$unpacked" --source-name "$(basename "$archive")" --source-version "$VERSION" \
              -o "spdx-json=$archive.spdx.json"
          done
      - name: Attest the SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=(--verify-tag --title "$TAG" --generate-notes)
            if [[ "$VERSION" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" --clobber \
            dist/*.tar.gz dist/*.tar.gz.spdx.json dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
