name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Changed areas
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide which areas the change touches
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: deploy/ci/changed-areas.sh "$EVENT" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    name: Docs and hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test Claude Code hooks
        run: make hooks-test
      - name: Check the Arabic and English docs
        run: make docs-check

  go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Go (lint, test, vulnerabilities)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhow
          POSTGRES_PASSWORD: dhow-ci-only
          POSTGRES_DB: dhow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DHOW_TEST_DATABASE_URL: postgres://dhow:dhow-ci-only@localhost:5432/dhow_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Verify generated code is current
        run: |
          make gen
          git diff --exit-code -- apps/server/internal/Modules apps/server/internal/Database/Sqlc packages/proto/gen
          test -z "$(git status --porcelain --untracked-files=all -- packages/proto/gen)"
      - name: Fetch main for the proto breaking check
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/heads/main
      - name: Lint the runner protocol
        run: make proto-lint
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      - name: Lint the runner with the fake driver build tag
        run: make lint-runner
      - name: Let the offline CLI test create a network namespace and trace system calls
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q strace
      - name: Test
        env:
          DHOW_CLI_REQUIRE_NETNS: "1"
        run: make test
      - name: Test the runner with the fake sandbox driver
        run: make test-runner
      - name: Fuzz the runner briefly
        run: make fuzz-runner FUZZTIME=10s
      - name: Fuzz the auth inputs (10 seconds per target)
        run: make fuzz FUZZTIME=10s
      - name: Vulnerabilities
        run: make vuln
      - name: Lint workflows
        run: make lint-actions
      - name: Build
        run: make build
      - name: Build the runner
        run: make build-runner
      - name: Build the CLI
        run: make build-cli

  timing:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Go (timing side channels)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhow
          POSTGRES_PASSWORD: dhow-ci-only
          POSTGRES_DB: dhow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DHOW_TEST_DATABASE_URL: postgres://dhow:dhow-ci-only@localhost:5432/dhow_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Statistical timing tests
        run: make timing

  isolation:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Runner isolation (rootless Podman)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhow
          POSTGRES_PASSWORD: dhow-ci-only
          POSTGRES_DB: dhow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the runner changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- apps/runner packages/proto internal deploy/systemd go.mod go.sum Makefile .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: Install the sandbox tools
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman busybox-static crun uidmap
      - name: Require Podman 5.4 or newer
        if: steps.scope.outputs.run == 'true'
        run: |
          podman --version
          have="$(podman version --format '{{.Client.Version}}')"
          if [ "$(printf '%s\n' 5.4.0 "$have" | sort -V | head -n1)" != 5.4.0 ]; then
            echo "::error::Podman $have is older than 5.4, which the rootless sandbox needs (ADR-0043)"
            exit 1
          fi
      - name: Prepare a dedicated runner user
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo useradd --create-home --shell /usr/sbin/nologin dhowci
          sudo sed -i '/^dhowci:/d' /etc/subuid /etc/subgid
          sudo usermod --add-subuids 200000-1199999 --add-subgids 200000-1199999 dhowci
          stat -fc %T /sys/fs/cgroup
      - name: Escape and limits suites
        if: steps.scope.outputs.run == 'true'
        run: >-
          make runner-isolation ISOLATION_DIR=/tmp/dhow-isolation
          ISOLATION_RUN="sudo systemd-run --uid=dhowci --gid=dhowci --pipe --wait --collect --quiet
          -p Delegate=yes -p MemorySwapMax=0 --working-directory=/tmp --"
      - name: Escape and limits suites inside the sandbox of the shipped runner unit
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo install -d -m 0755 /opt/dhow-isolation
          sudo install -m 0755 /tmp/dhow-isolation/dhow-runner /tmp/dhow-isolation/escape-probe /tmp/dhow-isolation/isolation.test /opt/dhow-isolation/
          sudo install -d -m 0700 -o dhowci -g dhowci /var/lib/dhow-runner
          props=$(deploy/systemd/sandbox-properties.sh deploy/systemd/dhow-runner.service)
          echo "Unit sandbox: $props"
          eval "sudo systemd-run --uid=dhowci --gid=dhowci --pipe --wait --collect --quiet $props --setenv=HOME=/var/lib/dhow-runner --working-directory=/tmp -- \
            env DHOW_ISOLATION_BIN=/opt/dhow-isolation DHOW_ISOLATION_BUSYBOX=/bin/busybox \
            /opt/dhow-isolation/isolation.test -test.v -test.count=1 -test.timeout 30m"
          sudo rm -rf /var/lib/dhow-runner
      - name: The runner comes online under the shipped unit and rotates its keys
        if: steps.scope.outputs.run == 'true'
        run: |
          make build build-runner
          sudo deploy/systemd/smoke-runner.sh bin/dhow-server bin/dhow-runner \
            "postgres://dhow:dhow-ci-only@127.0.0.1:5432/dhow?sslmode=disable"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web (lint, typecheck, test, build, size)
    runs-on: ubuntu-24.04
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enable pnpm from the packageManager field
        run: |
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify generated files are current
        run: |
          pnpm gen:api
          pnpm gen:tokens
          git diff --exit-code -- Src/Core/Api/Schema.d.ts Src/Styles/Tokens.css
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Check the bundle size budget
        run: pnpm size

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.web == 'true'
    name: Image (build, smoke test, SBOM, vulnerability scan)
    runs-on: ubuntu-24.04
    env:
      IMAGE: dhow:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image and smoke test a fresh Compose install
        run: make smoke
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: dhow.spdx.json
          upload-artifact: false
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhow-sbom-spdx
          path: dhow.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
