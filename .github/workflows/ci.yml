name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, test, vulnerabilities)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhow
          POSTGRES_PASSWORD: dhow-ci-only
          POSTGRES_DB: dhow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DHOW_TEST_DATABASE_URL: postgres://dhow:dhow-ci-only@localhost:5432/dhow_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Verify generated code is current
        run: |
          make gen
          git diff --exit-code -- apps/server/internal/Modules apps/server/internal/Database/Sqlc packages/proto/gen
          test -z "$(git status --porcelain --untracked-files=all -- packages/proto/gen)"
      - name: Fetch main for the proto breaking check
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/heads/main
      - name: Lint the runner protocol
        run: make proto-lint
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      - name: Test
        run: make test
      - name: Vulnerabilities
        run: make vuln
      - name: Lint workflows
        run: make lint-actions
      - name: Build
        run: make build
      - name: Test Claude Code hooks
        run: make hooks-test

  web:
    name: Web (lint, typecheck, test, build, size)
    runs-on: ubuntu-24.04
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enable pnpm from the packageManager field
        run: |
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify generated files are current
        run: |
          pnpm gen:api
          pnpm gen:tokens
          git diff --exit-code -- Src/Core/Api/Schema.d.ts Src/Styles/Tokens.css
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Check the bundle size budget
        run: pnpm size

  image:
    name: Image (build, smoke test, SBOM, vulnerability scan)
    runs-on: ubuntu-24.04
    env:
      IMAGE: dhow:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image and smoke test a fresh Compose install
        run: make smoke
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: dhow.spdx.json
          upload-artifact: false
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhow-sbom-spdx
          path: dhow.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
