name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, test, vulnerabilities)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dhow
          POSTGRES_PASSWORD: dhow-ci-only
          POSTGRES_DB: dhow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DHOW_TEST_DATABASE_URL: postgres://dhow:dhow-ci-only@localhost:5432/dhow_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Verify generated code is current
        run: |
          make gen
          git diff --exit-code -- apps/server/internal/api/gen apps/server/internal/db/sqlc
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build from source with the pinned toolchain; prebuilt binaries may target an older Go.
          install-mode: goinstall
      - name: Test
        run: make test
      - name: Vulnerabilities
        run: make vuln
      - name: Lint workflows
        run: make lint-actions
      - name: Build
        run: make build
