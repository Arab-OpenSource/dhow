name: Installer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/server/internal/Core/Installer/**
      - apps/server/internal/Config/**
      - apps/server/cmd/dhow-server/**
      - apps/runner/**
      - internal/installer/**
      - internal/runnersig/**
      - packages/proto/**
      - deploy/**
      - apps/web/vite.config.ts
      - apps/web/package.json
      - .github/workflows/installer.yml
      - .github/workflows/release.yml
      - Makefile
      - go.mod
      - go.sum
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Scripts and the systemd unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the shell scripts
        run: |
          bash -n deploy/install/get.sh deploy/install/e2e/*.sh deploy/release/dist.sh deploy/systemd/*.sh deploy/test-vm/*.sh deploy/dev/setup.sh deploy/dev/lib/*.sh deploy/dev/stack/*.sh
          shellcheck deploy/install/get.sh deploy/install/e2e/*.sh deploy/release/dist.sh deploy/systemd/*.sh deploy/test-vm/*.sh
          shellcheck -x deploy/dev/setup.sh
          shellcheck deploy/dev/test/fresh.sh
          shellcheck -x deploy/dev/test/settings.sh
          shellcheck deploy/dev/stack/*.sh
          bash deploy/dev/test/settings.sh
      - name: Check the setup script with the bash 3.2 of macOS
        run: docker run --rm -v "$PWD":/w:ro -w /w bash:3.2 bash deploy/dev/test/settings.sh
      - name: Parse the Windows setup script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/dev/setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Rate the systemd unit
        run: |
          systemd-analyze security --offline=yes --no-pager deploy/systemd/dhow.service | tail -1 | tee rating.txt
          grep -Eq 'exposure level for dhow.service: [0-9.]+ (OK|SAFE|PERFECT)' rating.txt
      - name: Rate the runner systemd unit (MEDIUM or better, at most 6.9)
        run: |
          systemd-analyze security --offline=yes --no-pager deploy/systemd/dhow-runner.service | tail -1 | tee rating-runner.txt
          grep -Eq 'exposure level for dhow-runner.service: [0-6]\.[0-9] (MEDIUM|OK|SAFE|PERFECT)' rating-runner.txt

  get-runner:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: get.sh --component runner against a local release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build a runner-only release with dist.sh
        run: DIST_DIR="$RUNNER_TEMP/dist" DIST_COMPONENTS=runner DIST_ARCHES=amd64 deploy/release/dist.sh 0.0.0-ci "$GITHUB_SHA"
      - name: Install it with get.sh in a fresh container, and refuse tampered releases
        run: deploy/install/e2e/get-runner.sh "$RUNNER_TEMP/dist"

  runner-install:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: dhow-runner install, doctor, a job and uninstall with rootless Podman
    # ubuntu-24.04 ships Podman 4.9.3, below the 5.4 floor of ADR-0043, so the real-Podman run needs ubuntu-26.04
    # (the isolation job uses it for the same reason). runner-install-container covers ubuntu-24.04 hosts.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhow
          POSTGRES_PASSWORD: dhow-ci-only
          POSTGRES_DB: dhow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Podman from the distribution and allow user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman crun uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          podman --version
      - name: Install from an answers file, run doctor and a job, rotate the keys, install again and uninstall
        run: |
          make build build-runner
          sudo deploy/systemd/smoke-install.sh bin/dhow-server bin/dhow-runner \
            "postgres://dhow:dhow-ci-only@127.0.0.1:5432/dhow?sslmode=disable"

  runner-install-container:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: dhow-runner install in a Debian 13 systemd container (fake driver)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhow
          POSTGRES_PASSWORD: dhow-ci-only
          POSTGRES_DB: dhow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install, encrypt the identity with systemd-creds, run a job and uninstall
        run: make runner-install-e2e RUNNER_E2E_DATABASE_URL="postgres://dhow:dhow-ci-only@127.0.0.1:5432/dhow?sslmode=disable"

  dev-setup-fresh:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Development setup on a fresh ${{ matrix.image }} with a Windows PATH
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12", "fedora:latest"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the setup script as a new user on a bare image
        env:
          IMAGE: ${{ matrix.image }}
        run: >-
          docker run --rm -v "$PWD":/repo:ro "$IMAGE" /repo/deploy/dev/test/fresh.sh --yes --db=url
          --db-url=postgres://dhow:unused@127.0.0.1:5432/dhow
          --test-db-url=postgres://dhow:unused@127.0.0.1:5432/dhow_test

  dev-compose:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Development stack with Docker only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_FILE: deploy/dev/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack from a clean clone
        run: |
          test ! -e .env.dev
          docker compose up --detach
      - name: Wait for the server, the setup link and Vite
        run: |
          for _ in $(seq 1 180); do
            docker compose logs --no-color server > server.log
            if curl -sf http://127.0.0.1:8080/api/v1/health/ready >/dev/null && grep -q 'Dhow is ready' server.log; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/v1/health/ready
          grep -q '"setup_url":"http://localhost:5173/setup#' server.log
          grep -q 'Dhow is ready' server.log
          curl -sf -o index.html http://127.0.0.1:5173/
          grep -q '<div id="root">' index.html
          curl -sf http://127.0.0.1:5173/api/v1/health/ready
          test "$(stat -c %a .env.dev)" = 600
      - name: Restart the server when a Go file changes
        run: |
          before=$(docker compose logs server | grep -c '"msg":"listening"')
          touch apps/server/cmd/dhow-server/main.go
          for _ in $(seq 1 90); do
            now=$(docker compose logs server | grep -c '"msg":"listening"')
            [ "$now" -gt "$before" ] && break
            sleep 2
          done
          [ "$(docker compose logs server | grep -c '"msg":"listening"')" -gt "$before" ]
          curl -sf --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/api/v1/health/ready
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  dev-setup:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Development setup on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: --db=container
          - os: macos-latest
            args: --db=native --skip-web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the setup script without questions
        env:
          SETUP_ARGS: ${{ matrix.args }}
        run: |
          read -ra args <<<"$SETUP_ARGS"
          deploy/dev/setup.sh --yes "${args[@]}"
      - name: Start the server and wait for it
        run: |
          export PATH="$HOME/.local/share/dhow-dev/go/bin:$HOME/.local/share/dhow-dev/node/bin:$HOME/.local/bin:$PATH"
          make dev > server.log 2>&1 &
          for _ in $(seq 1 150); do
            curl -sf http://127.0.0.1:8080/api/v1/health/ready >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/v1/health/ready
          grep -q setup_url server.log

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Build dhow-server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhow-server
          path: bin/dhow-server
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: Install, doctor and uninstall on ${{ matrix.base }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        base: ["debian:12", "ubuntu:24.04", "rockylinux/rockylinux:9", "fedora:latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dhow-server
          path: bin
      - name: Run the installer end to end in a systemd container
        env:
          BASE: ${{ matrix.base }}
        run: |
          chmod +x bin/dhow-server
          deploy/install/e2e/run.sh "$BASE" bin/dhow-server
