name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api --method DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"; then
            echo "Deleted ${BRANCH}"
          elif gh api "repos/${REPO}/git/refs/heads/${BRANCH}" > /dev/null 2>&1; then
            echo "Could not delete ${BRANCH}" >&2
            exit 1
          else
            echo "${BRANCH} is already gone"
          fi
