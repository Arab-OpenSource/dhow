version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - funlen
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes: []
    nolintlint:
      require-explanation: true
      require-specific: true
    funlen:
      lines: 100
      statements: -1
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: false
              skipBlankLines: false
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, unparam, noctx]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/Arab-OpenSource/dhow]
